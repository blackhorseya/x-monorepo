name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:   # dependabot-sync.yml re-runs CI on the head it pushed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

# `shell: bash` is what turns on pipefail: the runner's default (`bash -e {0}`) lets `a | b` pass when a failed (#465).
defaults:
  run:
    shell: bash

jobs:
  # ── affected: which modules and which jobs does this change need? ─────────────
  # scripts/affected.sh → the go.work modules for the test matrix; scripts/ci-changes.sh → one
  # run_<job> flag per job below, from the files the PR touches (a docs / Grafana / workflow-only
  # PR runs almost nothing; a *_test.go-only PR runs the Go checks and the test matrix; product Go runs
  # the Go jobs and helm-kind; the release-snapshot / console-image
  # jobs have narrower triggers, see the table in scripts/ci-changes.sh).
  # Every job is its own job (no dynamic matrix over them) so a skipped one shows up as a skipped check.
  # On main (the release gate) and on dispatch every job runs: a skipped job must never be the
  # reason main is green. Skipped jobs count as success for required checks.
  affected:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # p90 20s, max 116s (last 11 days)
    outputs:
      groups: ${{ steps.detect.outputs.groups }}
      any: ${{ steps.detect.outputs.any }}
      run_gen_freshness: ${{ steps.jobs.outputs.run_gen_freshness }}
      run_lint: ${{ steps.jobs.outputs.run_lint }}
      run_work_sync: ${{ steps.jobs.outputs.run_work_sync }}
      run_coverage: ${{ steps.jobs.outputs.run_coverage }}
      run_build: ${{ steps.jobs.outputs.run_build }}
      run_release_snapshot: ${{ steps.jobs.outputs.run_release_snapshot }}
      run_actions_resolve: ${{ steps.jobs.outputs.run_actions_resolve }}
      run_web: ${{ steps.jobs.outputs.run_web }}
      run_console_e2e: ${{ steps.jobs.outputs.run_console_e2e }}
      run_console_image: ${{ steps.jobs.outputs.run_console_image }}
      run_helm: ${{ steps.jobs.outputs.run_helm }}
      run_scripts_test: ${{ steps.jobs.outputs.run_scripts_test }}
      run_helm_kind: ${{ steps.jobs.outputs.run_helm_kind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
      - id: detect
        env:
          CI_ALL: ${{ github.event_name != 'pull_request' && '1' || '' }}
        run: |
          git fetch origin main:refs/remotes/origin/main 2>/dev/null || echo "git fetch origin main failed (exit $?): using the origin/main the checkout has" >&2
          # main and dispatch: every module (the diff against main is empty there, which would
          # skip the whole test matrix); a PR: the modules its diff reaches. --matrix: one JSON array of
          # test jobs, [{"name": …, "modules": […]}]: the big modules one job each, the rest in one shared job (#547).
          groups=$(BASE_REF=origin/main scripts/affected.sh --matrix ${CI_ALL:+--all}) || exit $?
          any=$(jq -r 'if length > 0 then "true" else "false" end' <<< "$groups") || exit $?
          echo "groups=$groups" >> "$GITHUB_OUTPUT"
          echo "any=$any" >> "$GITHUB_OUTPUT"
          echo "affected: $groups"
      - id: jobs
        env:
          CI_ALL: ${{ github.event_name != 'pull_request' && '1' || '' }}
        run: |
          scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"
          { echo "### jobs for this change"; scripts/ci-changes.sh | sed 's/^run_/- /; s/=true/ ✅/; s/=false/ ⏭ skipped/'; } >> "$GITHUB_STEP_SUMMARY"

  # ── gen freshness: generated code must match its sources ───────────────────
  gen-freshness:
    needs: affected
    if: needs.affected.outputs.run_gen_freshness == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10 # p90 53s, max 225s (last 11 days)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
        with: { tools: "true" }   # ./bin cached on the pinned tool versions
      # a codegen task must fail before it deletes or writes anything when a ./bin tool is missing (#504): the real entries in a throwaway fixture, no git, ~20 s
      - run: scripts/gen-tools-test.sh
      - run: task check-gen-fresh-all # one definition shared with local runs: gen wire gen-ts, then git diff
      # a generated sample BC (plain and --events) in a copy of the tree must lint, build and test (#518); no postgres here, so its repository tests are not run
      - run: task new-bc-check

  lint:
    needs: affected
    if: needs.affected.outputs.run_lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10 # p90 120s, max 209s (last 11 days)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with: { setup_only: true }
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        # install-only still saves ~/.cache/golangci-lint in its post step; a pull request must not write (#450)
        with: { version: v2.14.0, install-only: true, skip-save-cache: "${{ github.event_name == 'pull_request' }}" }
      - run: task lint

  work-sync:
    needs: affected
    if: needs.affected.outputs.run_work_sync == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5 # p90 27s (last 11 days)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: task check-work-sync

  # ── tests: one job per big affected module, one shared job for the small ones (#547) ──
  test:
    needs: affected
    if: needs.affected.outputs.any == 'true'
    runs-on: ubuntu-latest
    name: test (${{ join(matrix.group.modules, ', ') }})
    timeout-minutes: 15 # p90 192s (apps/worker), max 238s; headroom for image pulls (last 11 days)
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJson(needs.affected.outputs.groups) }}
    # Integration tests start their own postgres:17-alpine via testcontainers
    # (pkgs/platform/postgres/pgtest) on the runner's Docker, the same path a
    # laptop takes. No TEST_DATABASE_URL here on purpose: with CI set, pgtest
    # fails instead of skipping when the runtime is missing, so a green matrix
    # means the integration tests ran.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
        with: { cache-scope: "test-${{ matrix.group.name }}" }
      # testcontainers lets the daemon pull a missing image with no retry; one Docker Hub 502 on
      # ryuk failed a run (39370298272). Pull postgres, redis and ryuk first, with retries.
      - run: scripts/ci-prepull-images.sh
      # every module of the group, each to the end; the red ones are named and the job fails at the end (scripts/test-modules.sh)
      - run: scripts/test-modules.sh
        env:
          MODULES_JSON: ${{ toJSON(matrix.group.modules) }}

  coverage:
    needs: affected
    if: needs.affected.outputs.run_coverage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5 # p90 28s (last 11 days)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: scripts/cover-gate.sh

  build:
    needs: affected
    if: needs.affected.outputs.run_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10 # p90 89s, max 158s (last 11 days)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: task build
      # which config file each `task` entry hands its binary: CONFIG must beat a parent APP_CONFIG (#414)
      - run: scripts/task-config-test.sh

  # ── helm: the chart renders under every ci/ profile and its derived numbers hold ──
  helm:
    needs: affected
    if: needs.affected.outputs.run_helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10 # p90 58s, max 262s (last 11 days)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
        with: { tools: "true" }   # kubeconform lives in ./bin
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with: { version: v4.3.0 }
      - run: task helm-check
      # The chart's templates / values changed: its version must be higher than the base's (#423). Pull requests only:
      # on main there is no base. The merge ref is checked out, so this is what the merge would bring.
      - name: the chart version rises with the chart
        if: github.event_name == 'pull_request'
        run: deployments/helm/check-chart-bump.sh "${{ github.base_ref }}"

  # The chart installed for real: kind + throwaway Postgres / Redis, images built from this
  # commit (the console one needs node: pnpm build of web/apps/console). task helm-kind is the whole of it on one
  # cluster (what a laptop runs):
  #   helm-kind          install → smoke → upgrade → smoke (task helm-kind-core)
  # It runs on product Go, web, helm and image changes.
  helm-kind:
    needs: affected
    if: needs.affected.outputs.run_helm_kind == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15 # helm-kind-up ~90 s + install/smoke/upgrade/smoke ~30 s (run 41920885162 also had negative ~40 s + outage ~65 s, removed with catalog-rpc in #518; the limit is left as is); the single job was 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: ./.github/actions/pnpm-cache
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with: { version: v4.3.0 }
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with: { version: v0.33.0, install_only: true }
      - run: task helm-kind-core
      - if: failure()
        run: |
          . scripts/best-effort.sh   # diagnostics after the failure: they print what they can and say when they cannot
          best_effort kubectl -n x-monorepo get all
          best_effort kubectl -n x-monorepo describe pods | tail -120
          best_effort kubectl -n x-monorepo logs -l app.kubernetes.io/name=x-monorepo --all-containers --tail=200

  # ── release config: the snapshot must build before anyone tags ─────────────
  # release.yml itself only ever runs on main (workflow_run), so this job also exercises the two
  # things that broke v0.26.0's first attempts after green PRs: the signing flags against the
  # cosign that cosign-installer actually installs (#119) — same cosign-installer tag and
  # cosign-release as release.yml (rekor-canary.yml reads it from there), keep them equal — and, in actions-resolve below, that every action ref exists.
  release-snapshot:
    needs: affected
    if: needs.affected.outputs.run_release_snapshot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20 # p90 302s, max 374s (last 11 days)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with: { version: "~> v2.18", install-only: true }
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - run: task release-check release-snapshot
      - name: .goreleaser.yaml's signs command works with this cosign (throwaway key)
        run: scripts/cosign-smoke.sh
      # cosign's default signing config must still be Rekor v1: #204's 409 handling is v1-only (#215).
      # TUF changes without a repo commit, so rekor-canary.yml runs this weekly as well.
      - name: the default signing config has no Rekor v2 log (#215)
        run: scripts/rekor-v2-canary.sh

  # ── actions-resolve: every `uses: owner/repo@ref` under .github exists on GitHub ──
  # actionlint checks YAML, not the remote; `sigstore/cosign-installer@v4` passed every PR and
  # failed the first release on main (#115). ~20 API calls, read-only token.
  actions-resolve:
    needs: affected
    if: needs.affected.outputs.run_actions_resolve == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5 # p90 13s (last 11 days)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: scripts/actions-resolve.sh
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  # ── scripts-test: the decision scripts above (which jobs run, what releases, which version) ──
  # A wrong rule in scripts/ci-changes.sh skips a job silently, so its rules are pinned by tests.
  scripts-test:
    needs: affected
    if: needs.affected.outputs.run_scripts_test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5 # p90 7s (last 11 days)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup # go + task: the check-modules / derived-MODULES cases run `go work edit` and `task` (jq is on the runner image)
      - run: scripts/test.sh

  # ── web: @repo/proto must typecheck against the generated TS, console must build ──
  web:
    needs: affected
    if: needs.affected.outputs.run_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10 # p90 49s, max 431s (last 11 days)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Task needs `go` on PATH (the MODULES variable runs `go work edit` on every task run) but nothing in
      # this job compiles or downloads a module: skip the Go module / build cache, ~390 MB restored for nothing.
      - uses: ./.github/actions/setup
        with: { go-cache: "false" }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with: { package_json_file: web/package.json }   # version from packageManager
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: ./.github/actions/pnpm-cache
      - run: task web-typecheck web-test web-build

  # ── console-e2e: the built console driven by Playwright against a real bin/rpc on Postgres ──
  # (E2E_DATABASE_URL: the webServer runs bin/migrate up first; poison / prune then run for real)
  # One job, one runner with its own postgres; 4 workers, see docs/ci.md.
  console-e2e:
    needs: affected
    if: needs.affected.outputs.run_console_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15 # p90 142s, max 656s (last 11 days)
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U app -d app" --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      E2E_DATABASE_URL: postgres://app:app@127.0.0.1:5432/app?sslmode=disable
      E2E_WORKERS: "4" # ubuntu-latest on a public repo has 4 vCPU (nproc=4 measured); unset locally = Playwright's default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: ./.github/actions/pnpm-cache
      - run: task build web-install
      - uses: ./.github/actions/playwright
      - run: task web-e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: web/apps/console/playwright-report
          retention-days: 7

  # ── console-image: image.spec.ts and admin.spec.ts against the image the release ships (in-memory rpc) ──
  # vite preview also serves the SPA and proxies /api, but web/apps/console/Dockerfile's nginx
  # config is what runs in the cluster: deep links → index.html, immutable assets, /api proxy.
  console-image:
    needs: affected
    if: needs.affected.outputs.run_console_image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15 # p90 112s, max 627s (last 11 days)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: ./.github/actions/pnpm-cache
      - run: task build web-install
      - uses: ./.github/actions/playwright
      - run: task web-e2e-image
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-image
          path: web/apps/console/playwright-report
          retention-days: 7
