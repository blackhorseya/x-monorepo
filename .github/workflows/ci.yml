name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:   # dependabot-sync.yml re-runs CI on the head it pushed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  # ── affected: which modules and which jobs does this change need? ─────────────
  # scripts/affected.sh → the go.work modules for the test matrix; scripts/ci-changes.sh → one
  # run_<job> flag per job below, from the files the PR touches (a docs / Grafana / workflow-only
  # PR runs almost nothing; Go runs the Go jobs, kind and k6; web runs web + e2e + image + kind…).
  # On main (the release gate) and on dispatch every job runs: a skipped job must never be the
  # reason main is green. Skipped jobs count as success for required checks.
  affected:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # p90 20s, max 116s (last 11 days)
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
      any: ${{ steps.detect.outputs.any }}
      run_gen_freshness: ${{ steps.jobs.outputs.run_gen_freshness }}
      run_lint: ${{ steps.jobs.outputs.run_lint }}
      run_work_sync: ${{ steps.jobs.outputs.run_work_sync }}
      run_coverage: ${{ steps.jobs.outputs.run_coverage }}
      run_build: ${{ steps.jobs.outputs.run_build }}
      run_breaking: ${{ steps.jobs.outputs.run_breaking }}
      run_release_snapshot: ${{ steps.jobs.outputs.run_release_snapshot }}
      run_actions_resolve: ${{ steps.jobs.outputs.run_actions_resolve }}
      run_web: ${{ steps.jobs.outputs.run_web }}
      run_console_e2e: ${{ steps.jobs.outputs.run_console_e2e }}
      run_console_image: ${{ steps.jobs.outputs.run_console_image }}
      run_helm: ${{ steps.jobs.outputs.run_helm }}
      run_scripts_test: ${{ steps.jobs.outputs.run_scripts_test }}
      run_helm_kind: ${{ steps.jobs.outputs.run_helm_kind }}
      run_k6: ${{ steps.jobs.outputs.run_k6 }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
      - id: detect
        env:
          CI_ALL: ${{ github.event_name != 'pull_request' && '1' || '' }}
        run: |
          git fetch origin main:refs/remotes/origin/main 2>/dev/null || true
          # main and dispatch: every module (the diff against main is empty there, which would
          # skip the whole test matrix); a PR: the modules its diff reaches.
          mods=$(BASE_REF=origin/main scripts/affected.sh ${CI_ALL:+--all} | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          echo "modules=$mods" >> "$GITHUB_OUTPUT"
          echo "any=$([ "$mods" != "[]" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "affected: $mods"
      - id: jobs
        env:
          CI_ALL: ${{ github.event_name != 'pull_request' && '1' || '' }}
        run: |
          scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"
          { echo "### jobs for this change"; scripts/ci-changes.sh | sed 's/^run_/- /; s/=true/ ✅/; s/=false/ ⏭ skipped/'; } >> "$GITHUB_STEP_SUMMARY"

  # ── gen freshness: generated code must match its sources ───────────────────
  gen-freshness:
    needs: affected
    if: needs.affected.outputs.run_gen_freshness == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10 # p90 53s, max 225s (last 11 days)
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: { tools: "true" }   # ./bin cached on the pinned tool versions
      - run: task gen wire gen-ts
      - name: generated code is stale → run `task gen wire gen-ts` and commit
        run: git diff --exit-code

  lint:
    needs: affected
    if: needs.affected.outputs.run_lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10 # p90 120s, max 209s (last 11 days)
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: bufbuild/buf-action@v1
        with: { setup_only: true }
      - uses: golangci/golangci-lint-action@v9
        with: { version: v2.14.0, install-only: true }
      - run: task lint

  work-sync:
    needs: affected
    if: needs.affected.outputs.run_work_sync == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5 # p90 27s (last 11 days)
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: task check-work-sync

  # ── tests: one job per affected module ─────────────────────────────────────
  test:
    needs: affected
    if: needs.affected.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15 # p90 192s (apps/worker), max 238s; headroom for image pulls (last 11 days)
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.affected.outputs.modules) }}
    # Integration tests start their own postgres:17-alpine via testcontainers
    # (pkgs/platform/postgres/pgtest) on the runner's Docker, the same path a
    # laptop takes. No TEST_DATABASE_URL here on purpose: with CI set, pgtest
    # fails instead of skipping when the runtime is missing, so a green matrix
    # means the integration tests ran.
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: { cache-scope: "test-${{ matrix.module }}" }
      - run: go test -race ./...
        working-directory: ${{ matrix.module }}

  coverage:
    needs: affected
    if: needs.affected.outputs.run_coverage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5 # p90 28s (last 11 days)
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: scripts/cover-gate.sh

  build:
    needs: affected
    if: needs.affected.outputs.run_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10 # p90 89s, max 158s (last 11 days)
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: task build

  # ── helm: the chart renders under every ci/ profile and its derived numbers hold ──
  helm:
    needs: affected
    if: needs.affected.outputs.run_helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10 # p90 58s, max 262s (last 11 days)
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: { tools: "true" }   # kubeconform lives in ./bin
      - uses: azure/setup-helm@v5
        with: { version: v4.3.0 }
      - run: task helm-check

  # The interceptors under traffic: tests/k6/smoke.sh runs the four k6 scripts, each against
  # its own ./bin/rpc on the service Postgres — load thresholds, rate limit at 50 rps (429 +
  # Retry-After, accepted ≈ rps), timeout at 1ns (every call DEADLINE_EXCEEDED), reservation
  # with a ./bin/worker beside the rpc (order → RESERVED latency). ~3 min.
  k6:
    needs: affected
    if: needs.affected.outputs.run_k6 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10 # p90 109s, max 169s (last 11 days)
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U app -d app" --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgres://app:app@127.0.0.1:5432/app?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: grafana/setup-k6-action@v1
      - run: task build
      - run: APP_CONFIG=configs/config.example.yaml APP_POSTGRES_URL=$DATABASE_URL bin/migrate up
      - run: task k6-smoke
      - if: failure()
        run: tail -n 50 bin/k6-*.log

  # The chart installed for real: kind + throwaway Postgres / Redis, images built from this
  # commit (the console one needs node: pnpm build of web/apps/console), install → smoke →
  # upgrade → smoke (task helm-kind), and, on a cluster of its own, KEDA + an OTLP collector +
  # Prometheus and a k6 burst that must scale the worker out on eventbus_consumer_lag and back
  # (task helm-kind-keda). The two never shared state beyond the base (helm-kind-up: cluster,
  # images, Postgres / Redis), so they run as parallel matrix legs instead of back to back.
  helm-kind:
    name: helm-kind (${{ matrix.task }})
    needs: affected
    if: needs.affected.outputs.run_helm_kind == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15 # p90 289s, max 382s (last 11 days)
    strategy:
      fail-fast: false
      matrix:
        task: [helm-kind, helm-kind-keda]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: pnpm/action-setup@v6
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: azure/setup-helm@v5
        with: { version: v4.3.0 }
      - uses: helm/kind-action@v1
        with: { version: v0.33.0, install_only: true }
      - uses: grafana/setup-k6-action@v1
      - run: task ${{ matrix.task }}
      - if: failure()
        run: |
          kubectl -n x-monorepo get all
          kubectl -n x-monorepo describe pods | tail -120
          kubectl -n x-monorepo logs -l app.kubernetes.io/name=x-monorepo --all-containers --tail=200 || true
          kubectl -n x-monorepo get scaledobject,hpa 2>/dev/null || true
          kubectl -n keda logs deploy/keda-operator --tail=50 2>/dev/null || true

  # ── release config: the snapshot must build before anyone tags ─────────────
  # release.yml itself only ever runs on main (workflow_run), so this job also exercises the two
  # things that broke v0.26.0's first attempts after green PRs: the signing flags against the
  # cosign that cosign-installer actually installs (#119) — same cosign-installer tag as
  # release.yml, keep them equal — and, in actions-resolve below, that every action ref exists.
  release-snapshot:
    needs: affected
    if: needs.affected.outputs.run_release_snapshot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20 # p90 302s, max 374s (last 11 days)
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
      - uses: goreleaser/goreleaser-action@v7
        with: { version: "~> v2.18", install-only: true }
      - uses: sigstore/cosign-installer@v4.1.2
      - run: task release-check release-snapshot
      - name: .goreleaser.yaml's signs command works with this cosign (throwaway key)
        run: scripts/cosign-smoke.sh

  # ── actions-resolve: every `uses: owner/repo@ref` under .github exists on GitHub ──
  # actionlint checks YAML, not the remote; `sigstore/cosign-installer@v4` passed every PR and
  # failed the first release on main (#115). ~20 API calls, read-only token.
  actions-resolve:
    needs: affected
    if: needs.affected.outputs.run_actions_resolve == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5 # p90 13s (last 11 days)
    steps:
      - uses: actions/checkout@v7
      - run: scripts/actions-resolve.sh
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  # ── scripts-test: the decision scripts above (which jobs run, what releases, which version) ──
  # A wrong rule in scripts/ci-changes.sh skips a job silently, so its rules are pinned by tests.
  scripts-test:
    needs: affected
    if: needs.affected.outputs.run_scripts_test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5 # p90 7s (last 11 days)
    steps:
      - uses: actions/checkout@v7
      - run: scripts/test.sh

  # ── breaking: warn only (decision: wire-incompatible changes are allowed, but visible) ──
  # ── web: @repo/proto must typecheck against the generated TS, console must build ──
  web:
    needs: affected
    if: needs.affected.outputs.run_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10 # p90 49s, max 431s (last 11 days)
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup   # Task (Go is unused here but comes with it)
      - uses: pnpm/action-setup@v6
        with: { package_json_file: web/package.json }   # version from packageManager
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: task web-typecheck web-build

  # ── console-e2e: the built console driven by Playwright against a real bin/rpc on Postgres ──
  # (E2E_DATABASE_URL: the webServer runs bin/migrate up first; poison / prune then run for real)
  console-e2e:
    needs: affected
    if: needs.affected.outputs.run_console_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15 # p90 142s, max 656s (last 11 days)
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U app -d app" --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      E2E_DATABASE_URL: postgres://app:app@127.0.0.1:5432/app?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: pnpm/action-setup@v6
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: task build web-install
      - uses: ./.github/actions/playwright
      - run: task web-e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/apps/console/playwright-report
          retention-days: 7

  # ── console-image: the same specs against the nginx image the release ships (in-memory rpc) ──
  # vite preview also serves the SPA and proxies /api, but web/apps/console/Dockerfile's nginx
  # config is what runs in the cluster: deep links → index.html, immutable assets, /api proxy.
  console-image:
    needs: affected
    if: needs.affected.outputs.run_console_image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15 # p90 112s, max 627s (last 11 days)
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: pnpm/action-setup@v6
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: task build web-install
      - uses: ./.github/actions/playwright
      - run: task web-e2e-image
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-image
          path: web/apps/console/playwright-report
          retention-days: 7

  breaking:
    needs: affected
    if: needs.affected.outputs.run_breaking == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5 # p90 8s (last 11 days)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: bufbuild/buf-action@v1
        with: { setup_only: true }
      - name: buf breaking (skipped while main has no protos)
        run: |
          git ls-tree -r --name-only origin/main -- protos | grep -q '\.proto$' || { echo "main has no protos yet — nothing to compare"; exit 0; }
          buf breaking --against '.git#ref=refs/remotes/origin/main' --error-format=github-actions
