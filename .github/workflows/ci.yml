name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:   # dependabot-sync.yml re-runs CI on the head it pushed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  # ── L2: which modules did this change touch? ────────────────────────────────
  affected:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
      - id: detect
        run: |
          git fetch origin main:refs/remotes/origin/main 2>/dev/null || true
          mods=$(BASE_REF=origin/main scripts/affected.sh | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          echo "modules=$mods" >> "$GITHUB_OUTPUT"
          echo "any=$([ "$mods" != "[]" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "affected: $mods"

  # ── gen freshness: generated code must match its sources ───────────────────
  gen-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: { tools: "true" }   # ./bin cached on the pinned tool versions
      - run: task gen wire gen-ts
      - name: generated code is stale → run `task gen wire gen-ts` and commit
        run: git diff --exit-code

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: bufbuild/buf-action@v1
        with: { setup_only: true }
      - uses: golangci/golangci-lint-action@v9
        with: { version: v2.14.0, install-only: true }
      - run: task lint

  work-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: task check-work-sync

  # ── tests: one job per affected module ─────────────────────────────────────
  test:
    needs: affected
    if: needs.affected.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.affected.outputs.modules) }}
    # Integration tests start their own postgres:17-alpine via testcontainers
    # (pkgs/platform/postgres/pgtest) on the runner's Docker, the same path a
    # laptop takes. No TEST_DATABASE_URL here on purpose: with CI set, pgtest
    # fails instead of skipping when the runtime is missing, so a green matrix
    # means the integration tests ran.
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: { cache-scope: "test-${{ matrix.module }}" }
      - run: go test -race ./...
        working-directory: ${{ matrix.module }}

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: scripts/cover-gate.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: task build

  # ── helm: the chart renders under every ci/ profile and its derived numbers hold ──
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: { tools: "true" }   # kubeconform lives in ./bin
      - uses: azure/setup-helm@v4
        with: { version: v4.3.0 }
      - run: task helm-check

  # ── release config: the snapshot must build before anyone tags ─────────────
  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
      - uses: goreleaser/goreleaser-action@v7
        with: { version: "~> v2.18", install-only: true }
      - run: task release-check release-snapshot

  # ── breaking: warn only (decision: wire-incompatible changes are allowed, but visible) ──
  # ── web: @repo/proto must typecheck against the generated TS, console must build ──
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup   # Task (Go is unused here but comes with it)
      - uses: pnpm/action-setup@v6
        with: { package_json_file: web/package.json }   # version from packageManager
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: task web-typecheck web-build

  breaking:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: bufbuild/buf-action@v1
        with: { setup_only: true }
      - name: buf breaking (skipped while main has no protos)
        run: |
          git ls-tree -r --name-only origin/main -- protos | grep -q '\.proto$' || { echo "main has no protos yet — nothing to compare"; exit 0; }
          buf breaking --against '.git#ref=refs/remotes/origin/main' --error-format=github-actions
