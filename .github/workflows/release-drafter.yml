name: release-drafter

# Refresh the draft release from the PRs merged since the last published release.
# Categories match on the Conventional Commits PR title (.github/release-drafter.yml), so
# there is no labeler and nothing runs on pull_request.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write        # create / update the draft release
  pull-requests: read

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
