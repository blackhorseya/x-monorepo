# Weekly check that cosign's default signing config still lists only Rekor v1 logs (#215).
# #204 made a Rekor 409 survivable by pinning cosign v3.1.4 (sigstore-go v1.3.0 fetches the entry
# Rekor already holds) — for v1 only; a v2 log fails the sign on the same 409. ci.yml's
# release-snapshot job runs scripts/rekor-v2-canary.sh on every PR that touches release inputs
# (and on main), but sigstore flips the default through its TUF root, which is not a commit in
# this repo: without a schedule a quiet week would never notice.
#
# Who sees a failure: GitHub emails the user who last edited this file's cron line (and the
# repository's failed-workflow notifications), and a failed scheduled run opens — or comments on —
# one issue titled "rekor-canary: …", which notifies whoever watches the repo. Scheduled
# workflows are switched off after 60 days without repository activity; a release is activity.
#
# The cosign installed is the one release.yml pins (same installer tag, cosign-release read from
# release.yml's own lines), so there is no fourth pin to keep equal.
name: rekor-canary

on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC, off the hour
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write   # open / comment on the failure issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: pin
        run: |
          # every `cosign-release:` in release.yml must agree, or there is no "the release's cosign"
          v=$(sed -n 's/^ *cosign-release: *//p' .github/workflows/release.yml | sort -u)
          [ "$(printf '%s\n' "$v" | grep -c .)" = 1 ] || { echo "release.yml pins cosign-release to: [$v]"; exit 1; }
          echo "cosign=$v" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ steps.pin.outputs.cosign }}
      - run: scripts/rekor-v2-canary.sh
      - name: open or update the failure issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="rekor-canary: cosign's default signing config changed or could not be read (#215)"
          body="The weekly canary failed: $RUN_URL. The step log says whether sigstore's default signing config now lists a Rekor v2 log (act on #215 before the next release) or whether TUF was unreachable (re-run the workflow)."
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$body"
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"; fi
