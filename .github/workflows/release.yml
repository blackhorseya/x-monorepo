name: release

# Tag a green main: `git tag v0.1.0 && git push origin v0.1.0`. goreleaser then builds the
# archives, publishes the GitHub Release and pushes one multi-arch image per app to ghcr.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # the Release and its assets
  packages: write   # ghcr.io/blackhorseya/x-monorepo/{rpc,worker,migrate}

env:
  GOTOOLCHAIN: local

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }   # changelog and {{ .PreviousTag }} need the history
      - uses: ./.github/actions/setup
      # dockers_v2 drives `docker buildx build --push` with --sbom and two platforms; the
      # default docker driver can do neither, so a docker-container builder is required.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2.18"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
