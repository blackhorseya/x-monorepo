name: release
run-name: "[release] ${{ github.event.workflow_run.head_sha || github.sha }}"

# Every green CI run on main becomes a release (same shape as kxcw-goapi-v2):
#   prepare   release-drafter → draft release "vX.Y.Z" with notes from the merged PRs' titles
#   build     goreleaser on that commit → archives onto the draft + one multi-arch image per
#             app on ghcr (tagged vX.Y.Z before anything is published)
#   publish   gh release edit --draft=false → GitHub creates the tag and marks it latest
# Nothing deploys. workflow_dispatch re-runs the whole chain for the current main HEAD.
#
# workflow_run has no paths-ignore, so `prepare` gates by hand: diff the commit against the last
# published tag and skip the whole chain when only docs / web / CI config / tests changed. The
# diff base is the last tag, not the parent commit — ci.yml cancels in-progress main runs, so two
# quick merges fire release once, for the second head, and it must still see the first's changes.
#
# workflow_run's github.sha is default-branch HEAD, not the commit CI ran on: use
# github.event.workflow_run.head_sha everywhere. A release published with GITHUB_TOKEN emits
# no `push: tags` / `release` events to other workflows (recursion prevention), which is why
# this file has no tag trigger and nothing else chains off the tag.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create / update the draft release
      pull-requests: read    # list merged PRs
    outputs:
      release: ${{ steps.gate.outputs.release }}
      tag: ${{ steps.draft.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0   # tags, for the diff base
      - id: gate
        name: Anything to release since the last tag?
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "manual dispatch: releasing \`$HEAD_SHA\` unconditionally" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          base=$(git describe --tags --abbrev=0 --match 'v*' "$HEAD_SHA" 2>/dev/null || true)
          if [ -z "$base" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "no previous tag reachable from \`$HEAD_SHA\`: releasing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Paths that change no shipped artifact. Pathspec `*` crosses `/`, so `*.md` is any depth.
          # README.md / LICENSE are packed into the archives but a stale copy there is acceptable.
          releasable() {
            git diff --name-only "$base" "$HEAD_SHA" -- . \
              ':!*.md' ':!docs' ':!web' ':!.github' ':!.claude' ':!.idea' \
              ':!lefthook.yml' ':!.golangci.yml' ':!*_test.go' ':!testdata'
          }
          if [ -z "$(releasable)" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "## skipped: nothing releasable since $base" >> "$GITHUB_STEP_SUMMARY"
            git diff --name-only "$base" "$HEAD_SHA" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          { echo "## releasable changes since $base"; releasable | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: release-drafter/release-drafter@v7
        if: steps.gate.outputs.release == 'true'
        id: draft
        with:
          publish: false
          commitish: ${{ github.event.workflow_run.head_sha || github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: [prepare]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # upload archives to the draft
      packages: write   # ghcr.io/blackhorseya/x-monorepo/{rpc,worker,migrate}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
      # The tag does not exist yet (publish creates it), but goreleaser ≥ v2.18.1 refuses to run
      # without one, so create it locally on the commit being released. Never pushed.
      - run: git tag "${{ needs.prepare.outputs.tag }}" "$HEAD_SHA"
      - uses: ./.github/actions/setup
      # dockers_v2 drives `docker buildx build --push` with --sbom and two platforms; the
      # default docker driver can do neither, so a docker-container builder is required.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2.18"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.prepare.outputs.tag }}
      - run: |
          {
            echo "## ${{ needs.prepare.outputs.tag }} built from \`$HEAD_SHA\`"
            for app in rpc worker migrate; do
              echo "- \`ghcr.io/blackhorseya/x-monorepo/$app:${TAG#v}\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
        env: { TAG: "${{ needs.prepare.outputs.tag }}" }

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft (creates the tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --repo "$REPO" --target "$HEAD_SHA" --draft=false --latest
