name: labeler

# Labels a PR from its title (Conventional Commits type) and from the paths it touches,
# via release-drafter's autolabeler (rules in .github/release-drafter.yml). Display only:
# release.yml's prepare job files PRs by title (`when.conventional`), never by label.
# pull_request_target: runs with the base repo's token on forks too, no checkout, no PR code runs.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: release-drafter/release-drafter@v7
        with:
          disable-releaser: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
