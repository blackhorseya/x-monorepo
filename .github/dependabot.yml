# Dependabot scans one module directory at a time and does not understand go.work, so a
# Go bump touches a single go.mod and the other modules drift. dependabot-sync.yml runs
# `task tidy` on its branch, commits, and re-runs CI, so Go version updates can stay on.
# Go bumps are grouped into one weekly PR across all modules; Actions and npm bumps likewise.
# npm: the pnpm workspace under web/ (one lockfile). The console is a shipped artifact
# (ghcr .../console), so a merged npm bump cuts a patch release — hence weekly and grouped.
# @bufbuild/protobuf / @connectrpc bumps may need `task gen-ts` to regenerate packages/proto.
# docker: the two shipped base images (distroless for rpc / worker / migrate, nginx-unprivileged
# for the console), pinned as tag@sha256 so a bump moves both. A merged bump changes a shipped
# image, so it cuts a patch release. CI / kind test images (postgres, redis, otel) are not covered.
# github-actions: every third-party `uses:` is pinned to a commit SHA with its tag as a trailing
# comment (`@<sha> # v7`); Dependabot bumps the SHA and rewrites that comment together. Local
# `./.github/actions/*` are not versioned, but their own `uses:` are scanned. A bump touches CI only, so it cuts no release.
# Titles: `build(deps): …` (`ci(deps): …` for Actions) so release-drafter files them under Dependencies.
version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/pkgs/*", "/apps/*"]
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    commit-message: { prefix: build, include: scope }
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule: { interval: weekly }
    commit-message: { prefix: ci, include: scope }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/web"
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    commit-message: { prefix: build, include: scope }
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/deployments/docker", "/web/apps/console"]
    schedule: { interval: weekly }
    commit-message: { prefix: build, include: scope }
    groups:
      docker:
        patterns: ["*"]
