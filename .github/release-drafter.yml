# release-drafter (v7) drafts the next GitHub Release: every PR merged since the last published
# release is filed by its Conventional Commits title (`when.conventional` parses the title; no labels),
# and the next version comes from the matching category's semver-increment:
# `!` → major, feat → minor, everything else → patch.
# Run by .github/workflows/release.yml (prepare job) after every green CI on main; the same
# workflow then fills the draft with goreleaser and publishes it. Nobody tags by hand.
name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - type: pre-exclude
    when:
      conventional: { types: [test] }
  - title: "⚠️ Breaking"
    semver-increment: major
    exclusive: true
    when:
      conventional: { breaking: true }
  - title: "🚀 Features"
    semver-increment: minor
    exclusive: true
    when:
      conventional: { type: feat }
  - title: "🐛 Bug fixes"
    exclusive: true
    when:
      conventional: { type: fix }
  - title: "📦 Dependencies"
    exclusive: true
    collapse-after: 5
    when:
      conventional: { type: build, scope: deps }
  - title: "🧰 Maintenance"
    exclusive: true
    when:
      conventional: { types: [chore, refactor, perf, ci, build] }
  - title: "📚 Docs"
    exclusive: true
    when:
      conventional: { types: [docs, doc] }
  - title: "Other"
    exclusive: true
  - type: version-resolver
    semver-increment: patch

change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
change-title-escapes: '\<*_&'
no-changes-template: "- no changes"

template: |
  ## Changes

  $CHANGES

  ## Images

  ```
  ghcr.io/blackhorseya/x-monorepo/rpc:$RESOLVED_VERSION
  ghcr.io/blackhorseya/x-monorepo/worker:$RESOLVED_VERSION
  ghcr.io/blackhorseya/x-monorepo/migrate:$RESOLVED_VERSION
  ```

  **Full changelog**: https://github.com/blackhorseya/x-monorepo/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
