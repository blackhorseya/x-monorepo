syntax = "proto3";

package payment.v1;

import "common/v1/money.proto";
import "google/protobuf/timestamp.proto";

// Entity messages are the cross-language state schema of the payment
// aggregate. They are a wire contract, NOT the domain model: Go keeps the
// hand-written aggregate in domain/payment and maps at the adapter boundary.

// PaymentStatus mirrors docs/payment.md §3. Only PENDING accepts StartPayment.
enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  // Created, the window is running, nothing collected yet.
  PAYMENT_STATUS_PENDING = 1;
  // The provider confirmed the money, amount and currency matching.
  PAYMENT_STATUS_CAPTURED = 2;
  // The window ran out and the provider reported no payment. A late capture can still land.
  PAYMENT_STATUS_EXPIRED = 3;
  // The order was cancelled (or completed without this payment). A late capture can still land.
  PAYMENT_STATUS_CANCELLED = 4;
  // A full refund is owed; the provider call is in progress or waiting for a retry.
  PAYMENT_STATUS_REFUNDING = 5;
  // Terminal: the refund went through.
  PAYMENT_STATUS_REFUNDED = 6;
  // Terminal: money arrived but its amount or currency does not match the payment. Operators
  // resolve it in the provider's back office; the system does not move it again.
  PAYMENT_STATUS_NEEDS_REVIEW = 7;
}

// Payment is the single payment of one order.
message Payment {
  string id = 1;
  string order_id = 2;
  string customer_id = 3;
  common.v1.Money amount = 4;
  PaymentStatus status = 5;
  // The payment window closes here; StartPayment refuses a PENDING payment at or after it.
  google.protobuf.Timestamp expires_at = 6;
  // The provider's hosted checkout page; empty until StartPayment has run.
  string checkout_url = 7;
  // The checkout page stops working here; empty until StartPayment has run.
  google.protobuf.Timestamp checkout_expires_at = 8;
  google.protobuf.Timestamp update_time = 9;
}
