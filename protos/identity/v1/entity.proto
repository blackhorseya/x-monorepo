syntax = "proto3";

package identity.v1;

import "google/protobuf/timestamp.proto";

// Entity messages are the cross-language state schema of the identity
// aggregates. They are a wire contract, NOT the domain model: Go keeps
// hand-written aggregates in domain/account and domain/apikey and maps at
// the adapter boundary.

enum AccountStatus {
  ACCOUNT_STATUS_UNSPECIFIED = 0;
  // Credentials of the account resolve to a principal.
  ACCOUNT_STATUS_ACTIVE = 1;
  // Every credential of the account is refused (auth.invalid_credential);
  // the keys themselves are untouched and work again after EnableAccount.
  ACCOUNT_STATUS_DISABLED = 2;
}

// Account is who an API key speaks for. The id is the principal's subject
// (rpc access line `sub`, span enduser.id); roles are what RequireRole checks.
message Account {
  string id = 1;
  string name = 2;
  repeated string roles = 3;
  AccountStatus status = 4;
  google.protobuf.Timestamp create_time = 5;
  google.protobuf.Timestamp update_time = 6;
  // Access tokens issued before this are refused (RevokeSessions). Unset: never
  // revoked. It is "sign out everywhere", not a compromise response: see
  // IdentityService.RevokeSessions.
  google.protobuf.Timestamp sessions_revoke_time = 7;
}

// Invite pre-binds an email to an account. It is single use, valid for 7 days,
// and carries no secret: the person signs in at the identity provider and claims it.
message Invite {
  string id = 1;
  string email = 2;
  string account_id = 3;
  google.protobuf.Timestamp create_time = 4;
  google.protobuf.Timestamp expire_time = 5;
  // Set once the invite has been claimed.
  google.protobuf.Timestamp claim_time = 6;
}

enum ApiKeyStatus {
  API_KEY_STATUS_UNSPECIFIED = 0;
  API_KEY_STATUS_ACTIVE = 1;
  // Revoked keys stay listed (who had what, until when) but never resolve again.
  API_KEY_STATUS_REVOKED = 2;
}

// ApiKey is one credential of an account. The secret is returned once, by
// CreateApiKey; only its SHA-256 is stored. prefix is the first characters of
// the secret, enough to tell keys apart in a listing and in a client's config.
message ApiKey {
  string id = 1;
  string account_id = 2;
  string name = 3;
  string prefix = 4;
  ApiKeyStatus status = 5;
  google.protobuf.Timestamp create_time = 6;
  // Unset: the key does not expire.
  google.protobuf.Timestamp expire_time = 7;
  // Set once the key is REVOKED.
  google.protobuf.Timestamp revoke_time = 8;
  // When the key last authenticated a request. Unset: never used (or used only
  // before this was recorded). Best-effort and throttled: written at most once per
  // auth.last_used_interval (default 1m) and dropped when the write fails, so it
  // can trail the real last use by up to about two intervals (more while writes fail); it is not an audit log.
  google.protobuf.Timestamp last_use_time = 9;
}
