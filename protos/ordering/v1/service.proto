syntax = "proto3";

package ordering.v1;

import "buf/validate/validate.proto";
import "ordering/v1/entity.proto";

// OrderService is the public RPC contract of the ordering bounded context.
// Request shape (buf.validate rules below) is rejected at the edge with
// INVALID_ARGUMENT before any use case runs; business invariants stay in the domain.
service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
  // ListOrders pages through orders newest first (create_time desc, id desc).
  // Cursor pagination per AIP-158: pass next_page_token back unchanged with the
  // SAME filters; a token issued for other filters is rejected as INVALID_ARGUMENT.
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
}

message CreateOrderRequest {
  string customer_id = 1 [(buf.validate.field).string.min_len = 1];
  repeated LineItem items = 2 [(buf.validate.field).repeated.min_items = 1];
}

message CreateOrderResponse {
  Order order = 1;
}

message GetOrderRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetOrderResponse {
  Order order = 1;
}

message CancelOrderRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message CancelOrderResponse {
  Order order = 1;
}

message ListOrdersRequest {
  // Empty = any customer.
  string customer_id = 1;
  // ORDER_STATUS_UNSPECIFIED = any status.
  OrderStatus status = 2;
  // 0 = server default (20); values above the maximum (100) are clamped; negative = INVALID_ARGUMENT.
  int32 page_size = 3 [(buf.validate.field).int32.gte = 0];
  // Opaque; from the previous ListOrdersResponse.next_page_token.
  string page_token = 4;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  // Empty when this is the last page.
  string next_page_token = 2;
}
