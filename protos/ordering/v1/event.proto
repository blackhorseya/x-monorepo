syntax = "proto3";

package ordering.v1;

import "common/v1/money.proto";
import "google/protobuf/timestamp.proto";

// Integration events of the ordering bounded context. The topic of every
// message is its fully-qualified proto name (e.g. "ordering.v1.OrderCreated").
//
// Published by ordering (through its transactional outbox, see
// pkgs/platform/outbox): other BCs subscribe to these. They are a wire
// contract like entity.proto: the domain raises order.Event values and the
// events adapter maps them here.

// OrderCreated is raised once per New order, in the same transaction that
// persists it.
message OrderCreated {
  string order_id = 1;
  string customer_id = 2;
  repeated OrderCreatedItem items = 3;
  common.v1.Money total = 4;
  google.protobuf.Timestamp created_at = 5;
}

message OrderCreatedItem {
  string sku = 1;
  int32 quantity = 2;
}

// OrderConfirmed is raised when an order moves to CONFIRMED: ordering consumed
// inventory.v1.StockReserved for it (every line reserved).
message OrderConfirmed {
  string order_id = 1;
  string customer_id = 2;
  google.protobuf.Timestamp confirmed_at = 3;
  // The order's actual total. Payment bills from it; an event without it (published before this
  // field existed) must be rejected, never read as a 0 charge (docs/payment.md §2).
  common.v1.Money total = 4;
}

// OrderPaid is raised when an order moves CONFIRMED → PAID. Reserved for Fulfillment; nothing
// publishes it until Payment lands (docs/payment.md §4).
message OrderPaid {
  string order_id = 1;
  string customer_id = 2;
  google.protobuf.Timestamp paid_at = 3;
}

// OrderCompleted is raised when an order moves to COMPLETED (CompleteOrder on a
// CONFIRMED order): inventory consumes it to commit the reservation.
message OrderCompleted {
  string order_id = 1;
  string customer_id = 2;
  google.protobuf.Timestamp completed_at = 3;
}

// OrderCancelled is raised when an order moves to CANCELLED, whatever asked
// for it (client call or OrderCancellationRequested).
message OrderCancelled {
  string order_id = 1;
  string customer_id = 2;
  google.protobuf.Timestamp cancelled_at = 3;
}

// Consumed by ordering from a broker. The consumer adapter decodes these and
// calls the SAME use cases the RPC adapter does.

// OrderCancellationRequested is published by another BC (e.g. payment timeout)
// to ask ordering to cancel an order.
message OrderCancellationRequested {
  string order_id = 1;
  // Free text from the requesting BC: informational only. Ordering neither stores nor logs it
  // (it is untrusted and unstable); the typed cause below is what it records.
  string reason = 2;
  google.protobuf.Timestamp requested_at = 3;
  // Why the requester asks, as a fixed enumeration. Additive (#427): an event published before this
  // field existed carries no cause (CANCELLATION_CAUSE_UNSPECIFIED), and a value this version of
  // ordering does not know is treated the same way — the order history records both as an
  // unclassified request (CANCELLATION_REQUESTED).
  CancellationCause cause = 4;
}

// CancellationCause classifies an OrderCancellationRequested.
enum CancellationCause {
  CANCELLATION_CAUSE_UNSPECIFIED = 0;
  // Inventory could not cover every line of the order.
  CANCELLATION_CAUSE_STOCK_SHORTAGE = 1;
  // Inventory gave the reservation back because it was held past its TTL.
  CANCELLATION_CAUSE_RESERVATION_EXPIRED = 2;
}
