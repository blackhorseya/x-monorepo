# Merged into the generated OpenAPI document (protoc-gen-connect-openapi `base=` option).
# Hand-written metadata only; paths/schemas come from the .proto files.
openapi: 3.1.0
info:
  title: Ordering API
  version: v1
  description: |
    Connect RPC contract of the ordering bounded context.
    Every procedure is `POST /api/ordering.v1.OrderService/<Method>` (the bare `/ordering.v1.OrderService/<Method>` works too, for gRPC) with a JSON body;
    errors use the Connect error shape `{ "code": "...", "message": "..." }` and carry
    the stable domain code in the `X-Error-Code` response header.
servers:
  - url: /api

# Auth (platform/server auth interceptor, auth.mode optional|required): either an API key
# or a JWT. Declared here so Scalar / Postman show an Auth field; with auth.mode: off they are ignored.
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Static key from `auth.api_keys` (`name=key[:role|role]`); the principal's subject is the name.
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT verified against `auth.jwt` (HS256 secret or PEM public key); claims sub / name / roles.
security:
  - apiKey: []
  - bearer: []
