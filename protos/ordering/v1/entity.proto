syntax = "proto3";

package ordering.v1;

import "buf/validate/validate.proto";
import "common/v1/money.proto";
import "google/protobuf/timestamp.proto";

// Entity messages are the cross-language state schema of the Order aggregate.
// They are a wire contract, NOT the domain model: Go keeps a hand-written
// aggregate in domain/order and maps at the adapter boundary.

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_PENDING = 1;
  ORDER_STATUS_CANCELLED = 2;
  // Every line was reserved by inventory (inventory.v1.StockReserved consumed). Still cancellable.
  ORDER_STATUS_CONFIRMED = 3;
  // Fulfilled (CompleteOrder): inventory commits the reservation — the stock is sold, not held.
  // Terminal: a completed order cannot be cancelled.
  ORDER_STATUS_COMPLETED = 4;
  // Payment received (docs/payment.md §2): CONFIRMED → PAID → COMPLETED. A PAID order cannot be
  // cancelled. Slice 1 defines the state and the transitions only; nothing reaches it yet.
  ORDER_STATUS_PAID = 5;
}

// LineItem is one line of an Order. unit_price is the snapshot of the catalog
// price at the moment the order was placed: a later reprice does not change it.
message LineItem {
  string sku = 1 [(buf.validate.field).string.min_len = 1];
  int32 quantity = 2 [(buf.validate.field).int32.gt = 0];
  common.v1.Money unit_price = 3 [(buf.validate.field).required = true];
}

message Order {
  string id = 1;
  string customer_id = 2;
  repeated LineItem items = 3;
  common.v1.Money total = 4;
  OrderStatus status = 5;
  google.protobuf.Timestamp create_time = 6;
  google.protobuf.Timestamp update_time = 7;
  // Snapshot of ordering.require_payment taken when the order became CONFIRMED, never changed
  // afterwards; false for every order that was CONFIRMED before the setting existed. Ordering decides
  // CompleteOrder and the payment events from this value only (docs/payment.md §2, §8).
  bool payment_required = 8;
}
