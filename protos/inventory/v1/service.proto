syntax = "proto3";

package inventory.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "inventory/v1/entity.proto";

// InventoryService is the public RPC contract of the inventory bounded context.
// Reservations are not made through RPC: they react to ordering.v1.OrderCreated
// (see pkgs/inventory/adapters/consumer); RPC only seeds and reads.
service InventoryService {
  // SetStock sets the on-hand quantity of a SKU (creates it when unknown).
  // Reserved quantity is untouched; on_hand below reserved is INVALID_ARGUMENT.
  rpc SetStock(SetStockRequest) returns (SetStockResponse);
  rpc GetStock(GetStockRequest) returns (GetStockResponse);
  // ListStocks pages through SKUs ascending, optionally narrowed by prefix
  // and to SKUs with something reserved.
  rpc ListStocks(ListStocksRequest) returns (ListStocksResponse);
  // GetReservation reads the outcome inventory recorded for an order.
  rpc GetReservation(GetReservationRequest) returns (GetReservationResponse);
  // ListReservations pages through reservations newest first, optionally by status.
  rpc ListReservations(ListReservationsRequest) returns (ListReservationsResponse);
  // ExpireReservations is `worker expire` over RPC: RESERVED reservations held
  // longer than older_than give their stock back (EXPIRED, inventory.v1.StockReleased)
  // and ordering is asked to cancel the order (ordering.v1.OrderCancellationRequested).
  // Oldest first, one transaction per call, at most limit of them; the routine
  // sweep is the CronJob, this is the operator's dry run / small run. Requires
  // the admin role when auth is on (x-error-code: auth.permission_denied).
  rpc ExpireReservations(ExpireReservationsRequest) returns (ExpireReservationsResponse);
}

message SetStockRequest {
  string sku = 1 [(buf.validate.field).string.min_len = 1];
  int32 on_hand = 2 [(buf.validate.field).int32.gte = 0];
}

message SetStockResponse {
  Stock stock = 1;
}

message GetStockRequest {
  string sku = 1 [(buf.validate.field).string.min_len = 1];
}

message GetStockResponse {
  Stock stock = 1;
}

message ListStocksRequest {
  // 0 = server default (20); values above the maximum (100) are clamped; negative = INVALID_ARGUMENT.
  int32 page_size = 1 [(buf.validate.field).int32.gte = 0];
  // Opaque; from the previous ListStocksResponse.next_page_token. It carries
  // the filters below: continuing it with different ones is INVALID_ARGUMENT.
  string page_token = 2;
  // Only SKUs starting with this (case-sensitive); empty = every SKU.
  string sku_prefix = 3 [(buf.validate.field).string.max_len = 64];
  // Only SKUs with reserved > 0, i.e. ones pending orders currently hold.
  bool only_reserved = 4;
}

message ListStocksResponse {
  repeated Stock stocks = 1;
  // Empty when this is the last page.
  string next_page_token = 2;
}

message GetReservationRequest {
  string order_id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetReservationResponse {
  Reservation reservation = 1;
}

message ListReservationsRequest {
  // RESERVATION_STATUS_UNSPECIFIED = any status.
  ReservationStatus status = 1;
  // 0 = server default (20); values above the maximum (100) are clamped; negative = INVALID_ARGUMENT.
  int32 page_size = 2 [(buf.validate.field).int32.gte = 0];
  // Opaque; from the previous ListReservationsResponse.next_page_token.
  string page_token = 3;
}

message ListReservationsResponse {
  repeated Reservation reservations = 1;
  // Empty when this is the last page.
  string next_page_token = 2;
}

message ExpireReservationsRequest {
  // A RESERVED reservation held at least this long expires. Required, positive.
  google.protobuf.Duration older_than = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).duration.gt = {}
  ];
  // List what would expire, change nothing.
  bool dry_run = 2;
  // Reservations per call, oldest first; 0 = server default (100), at most 1000.
  int32 limit = 3 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000
  }];
}

// ExpiredReservation is one reservation the call expired — or, dry run, would.
message ExpiredReservation {
  string order_id = 1;
  // When it was reserved (the start of the hold).
  google.protobuf.Timestamp reserved_at = 2;
  // How long it had been held when the call ran.
  google.protobuf.Duration held_for = 3;
}

message ExpireReservationsResponse {
  // Oldest first. len(expired) == limit means there may be more: call again.
  repeated ExpiredReservation expired = 1;
  bool dry_run = 2;
}
