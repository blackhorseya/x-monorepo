version: "2"

# Layer and bounded-context import rules (domain → kernel only, no BC reaching into another, apps
# not reaching into a BC's domain / application / infra, shared packages importing no BC) are NOT here: depguard `pkg`
# entries are prefix matches without wildcards, so they would be spelled per BC and every new BC would
# edit every existing one. They are Go tests (pkgs/platform/archtest/imports.go, run as `go test` in the
# module they judge), next to the DDD rules that are not about imports.

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - revive
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/blackhorseya/x-monorepo
