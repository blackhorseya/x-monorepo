{{- if .Values.paymentRpc.enabled }}
{{- include "x-monorepo.paymentRpc.validate" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "x-monorepo.fullname" . }}-payment-serve
  labels:
    {{- include "x-monorepo.labels" . | nindent 4 }}
    app.kubernetes.io/component: payment-serve
  {{- with .Values.paymentRpc.serve.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # ClusterIP only (the chart refuses anything else): the port carries the internal RPC as well as the webhook.
  type: ClusterIP
  selector:
    {{- include "x-monorepo.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: payment-serve
  ports:
    - name: http
      port: {{ .Values.paymentRpc.serve.service.port }}
      targetPort: http
      protocol: TCP
      appProtocol: kubernetes.io/h2c
{{- end }}
