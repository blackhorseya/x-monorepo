{{- with .Values.rpc.autoscaling }}
{{- if .enabled }}
{{- if not $.Values.rpc.resources.requests.cpu }}
{{- fail "rpc.autoscaling needs rpc.resources.requests.cpu (utilization is a share of the request)" }}
{{- end }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "x-monorepo.fullname" $ }}-rpc
  labels:
    {{- include "x-monorepo.labels" $ | nindent 4 }}
    app.kubernetes.io/component: rpc
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "x-monorepo.fullname" $ }}-rpc
  minReplicas: {{ .minReplicas }}
  maxReplicas: {{ .maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
