{{- $w := .Values.worker -}}
{{- $grace := include "x-monorepo.worker.terminationGracePeriodSeconds" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "x-monorepo.fullname" . }}-worker
  labels:
    {{- include "x-monorepo.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not $w.autoscaling.enabled }}
  replicas: {{ $w.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "x-monorepo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "x-monorepo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        {{- include "x-monorepo.checksums" . | nindent 8 }}
        {{- with $w.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "x-monorepo.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # > 8s handler drain + 10s router close. No probes: the worker has no HTTP server.
      terminationGracePeriodSeconds: {{ $grace }}
      containers:
        - name: worker
          image: {{ include "x-monorepo.image" (dict "root" . "app" "worker") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- /* The worker takes the payment_required snapshot, so with ordering.require_payment on it must know there is a payment-rpc to pay at: it refuses to start without payment.upstream (the same rule rpc has). Just the address, never the key: that is rpc's service credential. The chart sets it (worker.extraEnv cannot: APP_PAYMENT_* is refused there), and only with the switch on. */}}
          {{- $env := list }}
          {{- if (default dict .Values.config.ordering).require_payment }}
          {{- $env = append $env (dict "name" "APP_PAYMENT_UPSTREAM" "value" (include "x-monorepo.paymentRpc.upstream" .)) }}
          {{- end }}
          {{- include "x-monorepo.commonEnv" (dict "root" . "extra" (concat $env $w.extraEnv)) | nindent 10 }}
          resources:
            {{- toYaml $w.resources | nindent 12 }}
          {{- include "x-monorepo.configMount" . | nindent 10 }}
      {{- include "x-monorepo.configVolume" . | nindent 6 }}
      {{- with $w.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $w.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $w.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
