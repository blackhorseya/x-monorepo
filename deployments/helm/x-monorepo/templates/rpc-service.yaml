apiVersion: v1
kind: Service
metadata:
  name: {{ include "x-monorepo.fullname" . }}-rpc
  labels:
    {{- include "x-monorepo.labels" . | nindent 4 }}
    app.kubernetes.io/component: rpc
  {{- with .Values.rpc.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.rpc.service.type }}
  selector:
    {{- include "x-monorepo.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: rpc
  ports:
    - name: http
      port: {{ .Values.rpc.service.port }}
      targetPort: http
      protocol: TCP
      # Connect, gRPC-Web and native gRPC (h2c) all on this one port.
      appProtocol: kubernetes.io/h2c
