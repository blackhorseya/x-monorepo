{{- if .Values.catalogRpc.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "x-monorepo.fullname" . }}-catalog-rpc
  labels:
    {{- include "x-monorepo.labels" . | nindent 4 }}
    app.kubernetes.io/component: catalog-rpc
  {{- with .Values.catalogRpc.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.catalogRpc.service.type }}
  selector:
    {{- include "x-monorepo.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: catalog-rpc
  ports:
    - name: http
      port: {{ .Values.catalogRpc.service.port }}
      targetPort: http
      protocol: TCP
      appProtocol: kubernetes.io/h2c
{{- end }}
