{{- if .Values.paymentRpc.enabled }}
{{- include "x-monorepo.paymentRpc.validate" . -}}
{{- $c := .Values.paymentRpc.serve -}}
{{- $grace := include "x-monorepo.paymentRpc.serve.terminationGracePeriodSeconds" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "x-monorepo.fullname" . }}-payment-serve
  labels:
    {{- include "x-monorepo.labels" . | nindent 4 }}
    app.kubernetes.io/component: payment-serve
spec:
  replicas: {{ $c.replicaCount }}
  selector:
    matchLabels:
      {{- include "x-monorepo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: payment-serve
  template:
    metadata:
      labels:
        {{- include "x-monorepo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: payment-serve
      annotations:
        {{- include "x-monorepo.paymentRpc.checksums" . | nindent 8 }}
        {{- with $c.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "x-monorepo.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Same shutdown contract as rpc: readyz 503 for delaySeconds while still serving, then
      # timeoutSeconds of drain; the app does the waiting (distroless: no preStop).
      terminationGracePeriodSeconds: {{ $grace }}
      containers:
        - name: payment-rpc
          image: {{ include "x-monorepo.image" (dict "root" . "app" "payment-rpc") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          # Args, not env: extraEnv and a Secret cannot change them. The binary then refuses to start on an empty
          # postgres.url (in-memory payments, readyz 200), on any auth.mode but required, and on auth.api_keys that
          # are not exactly the one key named rpc, judged on the final effective settings (apps/payment-rpc CheckDurable).
          args: ["serve", "--require-durable"]
          # The refusal is the last thing the container logs; copy those lines into the Pod status
          # (terminated.message) so it can still be read once the node has recycled the container log.
          terminationMessagePolicy: FallbackToLogsOnError
          ports:
            - name: http
              containerPort: {{ (splitList ":" .Values.config.http.addr) | last | int }}
              protocol: TCP
          # Operator extraEnv first (it cannot name APP_AUTH_* / APP_PAYMENT_* / APP_POSTGRES_URL / APP_CONFIG: the
          # chart refuses), then what the chart sets: a duplicate name takes the LAST value, so the chart wins.
          # The Secret keys are secretKeyRef with optional: false, never envFrom: an external Secret without
          # APP_POSTGRES_URL keeps the pod from starting instead of letting it serve from memory with readyz 200.
          env:
            {{- with $c.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            - name: APP_CONFIG
              value: /etc/x-monorepo/config.yaml
            - name: APP_HTTP_SHUTDOWN_DELAY
              value: {{ printf "%ds" (int $c.shutdown.delaySeconds) | quote }}
            - name: APP_HTTP_SHUTDOWN_TIMEOUT
              value: {{ printf "%ds" (int $c.shutdown.timeoutSeconds) | quote }}
            {{- include "x-monorepo.paymentRpc.secretEnv" (dict "root" . "keys" (list "APP_POSTGRES_URL" "APP_AUTH_API_KEYS" "APP_PAYMENT_MOCK_WEBHOOK_SECRET")) | nindent 12 }}
          livenessProbe:
            httpGet: { path: /api/healthz, port: http }
            {{- toYaml $c.liveness | nindent 12 }}
          readinessProbe:
            httpGet: { path: /api/readyz, port: http }
            {{- toYaml $c.readiness | nindent 12 }}
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/x-monorepo
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "x-monorepo.fullname" . }}-payment-rpc
      {{- with $c.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
