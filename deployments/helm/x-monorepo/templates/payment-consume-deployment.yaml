{{- if .Values.paymentRpc.enabled }}
{{- include "x-monorepo.paymentRpc.validate" . -}}
{{- $c := .Values.paymentRpc.consume -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "x-monorepo.fullname" . }}-payment-consume
  labels:
    {{- include "x-monorepo.labels" . | nindent 4 }}
    app.kubernetes.io/component: payment-consume
spec:
  # Fixed: no autoscaling (docs/operations.md). Replicas of one consumer group split the work, but a
  # Postgres-broker consumer was not measured faster with more of them: raise replicaCount for availability.
  replicas: {{ $c.replicaCount }}
  selector:
    matchLabels:
      {{- include "x-monorepo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: payment-consume
  template:
    metadata:
      labels:
        {{- include "x-monorepo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: payment-consume
      annotations:
        {{- include "x-monorepo.paymentRpc.checksums" . | nindent 8 }}
        {{- with $c.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "x-monorepo.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # > 8s handler drain + 10s router close. No probes: consume has no HTTP server (it exits non-zero when
      # it cannot start and the Deployment restarts it; its health is the eventbus_* gauges over OTLP).
      terminationGracePeriodSeconds: {{ int $c.terminationGracePeriodSeconds }}
      containers:
        - name: payment-rpc
          image: {{ include "x-monorepo.image" (dict "root" . "app" "payment-rpc") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          # An arg, not env: no in-memory consumer (there would be no outbox to read).
          args: ["consume", "--require-durable"]
          terminationMessagePolicy: FallbackToLogsOnError
          # Only the Postgres URL and the provider's credential: no listener, so no service key. Operator extraEnv
          # first (it cannot name APP_AUTH_* / APP_PAYMENT_* / APP_WORKER_* / APP_REDIS_* / APP_POSTGRES_URL /
          # APP_CONFIG), then what the chart sets.
          env:
            {{- with $c.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            - name: APP_CONFIG
              value: /etc/x-monorepo/config.yaml
            {{- include "x-monorepo.paymentRpc.secretEnv" (dict "root" . "keys" (list "APP_POSTGRES_URL" "APP_PAYMENT_MOCK_WEBHOOK_SECRET")) | nindent 12 }}
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/x-monorepo
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "x-monorepo.fullname" . }}-payment-rpc
      {{- with $c.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
