{{- if and .Values.paymentRpc.enabled (not .Values.secrets.paymentRpc.existingSecret) }}
{{- include "x-monorepo.paymentRpc.validate" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "x-monorepo.paymentRpc.secretName" . }}
  labels:
    {{- include "x-monorepo.labels" . | nindent 4 }}
    app.kubernetes.io/component: payment-rpc
type: Opaque
stringData:
  {{- include "x-monorepo.paymentRpc.secretData" . | nindent 2 }}
{{- end }}
