{{- if and (not .Values.secrets.existingSecret) (include "x-monorepo.secretData" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "x-monorepo.fullname" . }}-env
  labels:
    {{- include "x-monorepo.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- include "x-monorepo.secretData" . | nindent 2 }}
{{- end }}
