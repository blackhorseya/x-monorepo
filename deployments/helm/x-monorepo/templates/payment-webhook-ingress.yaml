{{- $i := .Values.paymentRpc.ingress -}}
{{- if and .Values.paymentRpc.enabled $i.enabled }}
{{- include "x-monorepo.paymentRpc.validate" . -}}
# The provider's webhook, and only that: ONE path per host, matched exactly. The Connect RPC (the same port),
# /api/metrics, the probes and the docs are NOT routed. The route has no API key and no http.rate_limit (the
# signature is its credential, docs/payment.md §7), so the limits are this ingress's: ingress-nginx
# annotations, rendered from paymentRpc.ingress.rateLimit; the chart refuses an annotation that touches them.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "x-monorepo.fullname" . }}-payment-webhook
  labels:
    {{- include "x-monorepo.labels" . | nindent 4 }}
    app.kubernetes.io/component: payment-serve
  annotations:
    {{- with $i.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    nginx.ingress.kubernetes.io/limit-rps: {{ int $i.rateLimit.rps | quote }}
    nginx.ingress.kubernetes.io/limit-burst-multiplier: {{ int $i.rateLimit.burstMultiplier | quote }}
    nginx.ingress.kubernetes.io/limit-connections: {{ int $i.rateLimit.connections | quote }}
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: {{ $i.className }}
  {{- with $i.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $i.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /api/payment/webhook
            pathType: Exact
            backend:
              service:
                name: {{ include "x-monorepo.fullname" $ }}-payment-serve
                port:
                  name: http
    {{- end }}
{{- end }}
