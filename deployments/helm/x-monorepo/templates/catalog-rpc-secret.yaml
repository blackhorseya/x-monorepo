{{- if and .Values.catalogRpc.enabled (not .Values.secrets.catalogRpc.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "x-monorepo.catalogRpc.secretName" . }}
  labels:
    {{- include "x-monorepo.labels" . | nindent 4 }}
    app.kubernetes.io/component: catalog-rpc
type: Opaque
stringData:
  {{- include "x-monorepo.catalogRpc.secretData" . | nindent 2 }}
{{- end }}
