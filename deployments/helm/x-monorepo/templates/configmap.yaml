apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "x-monorepo.fullname" . }}
  labels:
    {{- include "x-monorepo.labels" . | nindent 4 }}
data:
  # Loaded via APP_CONFIG. Secrets and the derived http.shutdown_* come in as env (env wins).
  config.yaml: |
    {{- toYaml .Values.config | nindent 4 }}
