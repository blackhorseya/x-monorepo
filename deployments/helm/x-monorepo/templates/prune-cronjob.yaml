{{- $p := .Values.prune -}}
{{- if $p.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "x-monorepo.fullname" . }}-prune
  labels:
    {{- include "x-monorepo.labels" . | nindent 4 }}
    app.kubernetes.io/component: prune
spec:
  schedule: {{ $p.schedule | quote }}
  concurrencyPolicy: {{ $p.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ $p.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ $p.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "x-monorepo.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: prune
          annotations:
            {{- include "x-monorepo.checksums" . | nindent 12 }}
        spec:
          restartPolicy: Never
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          serviceAccountName: {{ include "x-monorepo.serviceAccountName" . }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: prune
              image: {{ include "x-monorepo.image" (dict "root" . "app" "worker") }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              securityContext:
                {{- toYaml .Values.containerSecurityContext | nindent 16 }}
              args:
                - prune
                - --older-than={{ $p.olderThan }}
                - --batch={{ $p.batch }}
                {{- if $p.dryRun }}
                - --dry-run
                {{- end }}
                {{- if $p.unconsumed }}
                - --unconsumed
                {{- end }}
                {{- range $p.forgetGroups }}
                - --forget-group={{ . }}
                {{- end }}
              {{- include "x-monorepo.commonEnv" (dict "root" . "extra" list) | nindent 14 }}
              resources:
                {{- toYaml $p.resources | nindent 16 }}
              {{- include "x-monorepo.configMount" . | nindent 14 }}
          {{- include "x-monorepo.configVolume" . | nindent 10 }}
{{- end }}
