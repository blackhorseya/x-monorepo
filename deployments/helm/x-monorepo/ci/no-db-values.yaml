# Profile 4: smoke test without a database — in-memory repositories, no migrate hook,
# no Secret. Validates that nothing in the chart requires one.
rpc:
  replicaCount: 1
worker:
  replicaCount: 1
prune:
  enabled: false
expire:
  enabled: false
# NetworkPolicies with nothing listed: rpc open to any source on its port, worker closed.
networkPolicy: { enabled: true }
