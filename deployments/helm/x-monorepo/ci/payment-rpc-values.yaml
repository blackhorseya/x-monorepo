# Profile 10: payment-rpc on (serve + consume + the expire CronJob + the webhook-only ingress), with
# everything it must NOT inherit set for rpc — an OIDC issuer, a legacy JWT, user api keys, a Redis
# broker (payment-worker reads the Postgres outbox only) — and the hardening knobs. check.py asserts
# none of it reaches payment-rpc's ConfigMap or Secret, and that only the webhook path is routed.
secrets:
  postgresUrl: postgres://app:app@postgres:5432/app?sslmode=disable
  redisUrl: redis://redis:6379/0
  apiKeys: "console=console-key-0123456789abc:admin"
  jwtHs256Secret: "0123456789abcdef0123456789abcdef"
  catalogRpc: { apiKey: "catalog-rpc-key-0123456789ab" }
  paymentRpc:
    apiKey: "payment-rpc-key-0123456789ab"
    mockWebhookSecret: "mock-webhook-secret-0123456789"
config:
  ordering: { require_payment: true }   # payment on, explicit: auth is optional below
  otel: { endpoint: otel-collector:4317, service_name: x-monorepo-rpc }
  worker: { broker: redis, consumer_group: worker }
  auth:
    mode: optional
    admin_role: operator
    jwt: { issuer: https://legacy.example.com, audience: x-monorepo, public_key: "" }
    oidc:
      enabled: true
      issuers:
        - { issuer: https://idp.example.com/realms/shop, audience: x-console, mapping: bound }
paymentRpc:
  enabled: true
  serve:
    extraEnv:
      - { name: APP_LOG_LEVEL, value: debug }   # allowed; APP_AUTH_* / APP_POSTGRES_URL / APP_CONFIG / APP_PAYMENT_* are not (ci-negative)
    serviceMonitor:
      enabled: true
      labels: { release: monitoring }
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: pay.example.com
    tls:
      - { secretName: pay-example-tls, hosts: [pay.example.com] }
    rateLimit: { rps: 5, burstMultiplier: 3, connections: 10 }
networkPolicy:
  enabled: true
  paymentRpc:
    ingressFrom:
      - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }
