# Profile 6: the hardening knobs on — NetworkPolicies with named peers, a ServiceMonitor for
# a kube-prometheus-stack release called "monitoring".
secrets:
  postgresUrl: postgres://app:app@postgres:5432/app?sslmode=disable
config:
  otel: { endpoint: otel-collector:4317 }
rpc:
  serviceMonitor:
    enabled: true
    interval: 15s
    labels: { release: monitoring }
networkPolicy:
  enabled: true
  rpc:
    ingressFrom:
      - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }
      - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
