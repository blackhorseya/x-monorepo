# Profile 1: defaults + a database. What a first install looks like.
imagePullSecrets: [{ name: ghcr }]   # exercises the field; the real packages are public
secrets:
  postgresUrl: postgres://app:app@postgres:5432/app?sslmode=disable
config:
  otel: { endpoint: otel-collector:4317 }
worker:
  autoscaling: { enabled: true, metric: cpu, minReplicas: 1, maxReplicas: 4, behavior: { scaleDown: { stabilizationWindowSeconds: 120 } } }
