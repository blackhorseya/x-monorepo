# Profile 11: payment-rpc with a Secret the operator manages. The release-wide one (which may hold a JWT
# secret) is rpc's alone and catalog-rpc has its own; payment-rpc reads a third, with APP_POSTGRES_URL,
# APP_AUTH_API_KEYS, APP_PAYMENT_API_KEY and APP_PAYMENT_MOCK_WEBHOOK_SECRET. Not the autoscaled /
# multi-replica defaults: one replica of each, no ingress.
secrets:
  existingSecret: my-release-secret
  catalogRpc:
    existingSecret: my-catalog-rpc-secret
  paymentRpc:
    existingSecret: my-payment-rpc-secret
paymentRpc:
  enabled: true
  serve:
    replicaCount: 1
  expire:
    intervalMinutes: 5
