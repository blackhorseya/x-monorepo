# Profile 7: external OIDC login on (docs/identity-login.md). Two issuers: a production-shaped https
# one and a dev http one that needs allow_insecure_issuer. The chart carries no IdP.
secrets:
  postgresUrl: postgres://app:app@postgres:5432/app?sslmode=disable
  catalogRpc: { apiKey: "catalog-rpc-key-0123456789ab" }
config:
  auth:
    mode: required
    oidc:
      enabled: true
      issuers:
        - issuer: https://idp.example.com/realms/shop
          audience: x-console
        - issuer: http://dex.localtest.me:5556/dex
          audience: x-console
          mapping: bound
          allow_insecure_issuer: true
