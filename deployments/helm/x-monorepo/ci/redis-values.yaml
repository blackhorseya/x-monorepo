# Profile 2: redis broker, autoscaling, ingress, auth required, prune with a forgotten group.
imagePullSecrets: [{ name: ghcr }]   # exercises the field; the real packages are public
secrets:
  postgresUrl: postgres://app:app@postgres:5432/app?sslmode=disable
  redisUrl: redis://redis:6379/0
  apiKeys: "console=0123456789abcdef0123456789abcdef:admin"
config:
  auth: { mode: required }
  otel: { endpoint: otel-collector:4317 }
  worker: { broker: redis, consumer_group: worker, start_from: latest, handler_timeout: 10s }
rpc:
  shutdown: { delaySeconds: 10, timeoutSeconds: 20, graceMarginSeconds: 5 }
  readiness: { periodSeconds: 10 }
  autoscaling: { enabled: true, minReplicas: 3, maxReplicas: 12 }
  ingress:
    enabled: true
    className: nginx
    hosts: [{ host: api.example.com, paths: [{ path: /, pathType: Prefix }] }]
    tls: [{ secretName: api-tls, hosts: [api.example.com] }]
worker:
  terminationGracePeriodSeconds: 45
  autoscaling:
    enabled: true
    metric: lag
    minReplicas: 2
    maxReplicas: 8
    lag: { prometheusAddress: http://prometheus.monitoring.svc:9090, threshold: 200 }
    behavior: { scaleDown: { stabilizationWindowSeconds: 120 } }
prune:
  schedule: "0 4 * * 0"
  olderThan: 168h
  forgetGroups: [old.ordering, old.inventory]
