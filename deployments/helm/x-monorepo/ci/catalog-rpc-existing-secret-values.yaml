# Profile 9: catalog-rpc with Secrets the operator manages: the release-wide one (which may hold a
# JWT secret) is rpc's alone; catalog-rpc reads its own, with APP_POSTGRES_URL and APP_AUTH_API_KEYS.
secrets:
  existingSecret: my-release-secret
  catalogRpc:
    existingSecret: my-catalog-rpc-secret
catalogRpc:
  enabled: true
  replicaCount: 1
