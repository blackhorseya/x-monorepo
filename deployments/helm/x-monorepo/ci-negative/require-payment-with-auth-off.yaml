# expect: config.auth.mode
# expect: secrets.paymentRpc.apiKey
# expect: config.ordering.require_payment=false
# expect: paymentRpc.enabled=false
# With auth off nobody can pay (docs/payment.md §6 (a)): every order would stay CONFIRMED.
config:
  ordering: { require_payment: true }
  auth: { mode: "off" }
paymentRpc: { enabled: true }
secrets:
  postgresUrl: "postgres://app:app@postgres:5432/app?sslmode=disable"
  catalogRpc: { apiKey: "catalog-rpc-key-0123456789ab" }
  paymentRpc: { apiKey: "payment-rpc-key-0123456789ab", mockWebhookSecret: "mock-webhook-secret-0123456789" }
