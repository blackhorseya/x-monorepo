# expect: ordering.require_payment
# expect: paymentRpc.enabled=true
# expect: config.ordering.require_payment=false
# Orders would wait for a payment nobody can start: rpc itself refuses to start without payment
# configured, and so does the chart.
config:
  ordering: { require_payment: true }
secrets:
  postgresUrl: "postgres://app:app@postgres:5432/app?sslmode=disable"
  catalogRpc: { apiKey: "catalog-rpc-key-0123456789ab" }
