# expect: paymentRpc.serve.service.type
# The serve Service carries the internal Connect RPC on the same port as the webhook: only ClusterIP,
# never an address outside the cluster.
paymentRpc:
  enabled: true
  serve:
    service: { type: "LoadBalancer", port: 80 }
secrets:
  postgresUrl: "postgres://app:app@postgres:5432/app?sslmode=disable"
  catalogRpc: { apiKey: "catalog-rpc-key-0123456789ab" }
  paymentRpc: { apiKey: "payment-rpc-key-0123456789ab", mockWebhookSecret: "mock-webhook-secret-0123456789" }
