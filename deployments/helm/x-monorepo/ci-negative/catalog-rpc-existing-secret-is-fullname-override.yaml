# expect: secrets.catalogRpc.existingSecret
# fullnameOverride moves the release-wide Secret's name (shop-env): the check follows the resolved name.
fullnameOverride: shop
catalogRpc: { enabled: true }
secrets:
  postgresUrl: "postgres://app:app@postgres:5432/app?sslmode=disable"
  catalogRpc: { existingSecret: shop-env }
