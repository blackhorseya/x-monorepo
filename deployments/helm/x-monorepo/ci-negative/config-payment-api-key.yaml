# expect: config.payment.api_key
# The key rpc presents to payment-rpc is a secret (APP_PAYMENT_API_KEY, from payment-rpc's Secret by secretKeyRef):
# in the release-wide ConfigMap every pod reads it would be everywhere, and the worker has no use for it.
paymentRpc: { enabled: true }
config:
  ordering: { require_payment: false }
  payment: { api_key: "payment-rpc-key-0123456789ab" }
secrets:
  postgresUrl: "postgres://app:app@postgres:5432/app?sslmode=disable"
  catalogRpc: { apiKey: "catalog-rpc-key-0123456789ab" }
  paymentRpc: { apiKey: "payment-rpc-key-0123456789ab", mockWebhookSecret: "mock-webhook-secret-0123456789" }
