# expect: secrets.existingSecret
# The other direction: the RELEASE-wide existingSecret is named like the Secret the chart renders for
# catalog-rpc itself (<fullname>-catalog-rpc-env, here t-x-monorepo-catalog-rpc-env) while catalog-rpc has no
# existingSecret of its own. rpc, worker and migrate would then read catalog-rpc's service-key Secret, and the
# chart would render a Secret over the operator's. The catalog-side name is the FINAL one, generated default included.
catalogRpc: { enabled: true }
secrets:
  existingSecret: t-x-monorepo-catalog-rpc-env
  postgresUrl: "postgres://app:app@postgres:5432/app?sslmode=disable"
  catalogRpc: { apiKey: "catalog-rpc-key-0123456789ab" }
