# expect: rpc.extraEnv
# The chart sets where rpc finds the catalog and with which key; extraEnv must not repoint or replace them (app_catalog_upstream).
rpc:
  extraEnv: [{ name: app_catalog_upstream, value: "http://elsewhere:80" }]
secrets:
  postgresUrl: "postgres://app:app@postgres:5432/app?sslmode=disable"
  catalogRpc: { apiKey: "catalog-rpc-key-0123456789ab" }
