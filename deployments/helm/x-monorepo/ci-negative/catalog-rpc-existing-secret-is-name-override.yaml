# expect: secrets.catalogRpc.existingSecret
# nameOverride changes the fullname too (release "t" + "foo" = t-foo), so the Secret is t-foo-env.
nameOverride: foo
catalogRpc: { enabled: true }
secrets:
  postgresUrl: "postgres://app:app@postgres:5432/app?sslmode=disable"
  catalogRpc: { existingSecret: t-foo-env }
