# expect: catalogRpc.extraEnv
# extraEnv must not set or shadow what makes catalog-rpc safe (app_auth_mode): auth, its Postgres URL, its config file.
catalogRpc:
  enabled: true
  extraEnv: [{ name: app_auth_mode, value: "off" }]
secrets:
  postgresUrl: "postgres://app:app@postgres:5432/app?sslmode=disable"
  catalogRpc: { apiKey: "catalog-rpc-key-0123456789ab" }
