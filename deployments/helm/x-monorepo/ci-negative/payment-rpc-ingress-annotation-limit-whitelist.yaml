# expect: paymentRpc.ingress.annotations
# The chart sets the limits and the single exposed path; an annotation here could lift a limit or
# route more than the webhook (nginx.ingress.kubernetes.io/limit-whitelist).
paymentRpc:
  enabled: true
  ingress:
    enabled: true
    className: "nginx"
    hosts: [{"host": "pay.example.com"}]
    rateLimit: { rps: 5, burstMultiplier: 3, connections: 10 }
    annotations: { nginx.ingress.kubernetes.io/limit-whitelist: "x" }
secrets:
  postgresUrl: "postgres://app:app@postgres:5432/app?sslmode=disable"
  catalogRpc: { apiKey: "catalog-rpc-key-0123456789ab" }
  paymentRpc: { apiKey: "payment-rpc-key-0123456789ab", mockWebhookSecret: "mock-webhook-secret-0123456789" }
