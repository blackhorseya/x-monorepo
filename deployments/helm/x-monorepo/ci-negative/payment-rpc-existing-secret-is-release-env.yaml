# expect: secrets.paymentRpc.existingSecret
# The chart renders the release-wide Secret itself (t-x-monorepo-env): naming it as payment-rpc's own
# points payment-rpc at rpc's keys. The RESOLVED name is compared.
paymentRpc: { enabled: true }
secrets:
  postgresUrl: "postgres://app:app@postgres:5432/app?sslmode=disable"
  catalogRpc: { apiKey: "catalog-rpc-key-0123456789ab" }
  paymentRpc: { existingSecret: "t-x-monorepo-env" }
config:
  ordering: { require_payment: false }
