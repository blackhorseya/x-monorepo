# expect: paymentRpc.ingress.rateLimit.rps
# The webhook route has no API key and no http.rate_limit (docs/payment.md §7): the ingress is the
# only place to limit a flood of unsigned requests.
paymentRpc:
  enabled: true
  ingress:
    enabled: true
    className: "nginx"
    hosts: [{"host": "pay.example.com"}]
    rateLimit: { rps: 0, burstMultiplier: 3, connections: 10 }
secrets:
  postgresUrl: "postgres://app:app@postgres:5432/app?sslmode=disable"
  catalogRpc: { apiKey: "catalog-rpc-key-0123456789ab" }
  paymentRpc: { apiKey: "payment-rpc-key-0123456789ab", mockWebhookSecret: "mock-webhook-secret-0123456789" }
