# expect: paymentRpc.serve.extraEnv
# payment-rpc serve: the chart owns auth, the Postgres URL, the config file, the provider and its
# credentials, the broker; an env var here would turn one off or replace it (APP_AUTH_API_KEYS).
paymentRpc:
  enabled: true
  serve:
    extraEnv: [{"name": "APP_AUTH_API_KEYS", "value": "x"}]
secrets:
  postgresUrl: "postgres://app:app@postgres:5432/app?sslmode=disable"
  catalogRpc: { apiKey: "catalog-rpc-key-0123456789ab" }
  paymentRpc: { apiKey: "payment-rpc-key-0123456789ab", mockWebhookSecret: "mock-webhook-secret-0123456789" }
config:
  ordering: { require_payment: false }
