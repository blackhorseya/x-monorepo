# expect: catalogRpc.extraEnv
# extraEnv must not set or shadow what makes catalog-rpc safe (APP_POSTGRES_URL): auth, its Postgres URL, its config file.
catalogRpc:
  enabled: true
  extraEnv: [{ name: APP_POSTGRES_URL, value: "postgres://x" }]
secrets:
  postgresUrl: "postgres://app:app@postgres:5432/app?sslmode=disable"
  catalogRpc: { apiKey: "catalog-rpc-key-0123456789ab" }
