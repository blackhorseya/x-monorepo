# expect: secrets.catalogRpc.existingSecret
# Two sources for the same Secret keys: the operator's own Secret AND chart-rendered values. Which one
# wins is exactly the ambiguity that put a wrong key in production elsewhere; refuse it.
catalogRpc: { enabled: true }
secrets:
  postgresUrl: "postgres://app:app@postgres:5432/app?sslmode=disable"
  catalogRpc: { existingSecret: my-catalog-rpc-secret, apiKey: "catalog-rpc-key-0123456789ab" }
