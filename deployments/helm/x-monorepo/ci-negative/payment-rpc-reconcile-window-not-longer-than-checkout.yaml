# expect: paymentRpc.config.reconcile_window
# A customer paying at the end of a page must be found by the sweep: reconcile_window has to outlast
# the checkout.
paymentRpc:
  enabled: true
  config: { reconcile_window: "30m", mock_checkout_ttl: "30m" }
secrets:
  postgresUrl: "postgres://app:app@postgres:5432/app?sslmode=disable"
  catalogRpc: { apiKey: "catalog-rpc-key-0123456789ab" }
  paymentRpc: { apiKey: "payment-rpc-key-0123456789ab", mockWebhookSecret: "mock-webhook-secret-0123456789" }
config:
  ordering: { require_payment: false }
