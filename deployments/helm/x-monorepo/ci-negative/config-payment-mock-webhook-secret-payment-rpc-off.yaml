# expect: config.payment.mock_webhook_secret
# config.* is written verbatim into the release-wide ConfigMap, which the worker and rpc mount: the provider's credential
# there would be readable by both. Refused whether or not payment-rpc is on (the worker never holds it).
config:
  payment: { mock_webhook_secret: "mock-webhook-secret-0123456789" }
secrets:
  postgresUrl: "postgres://app:app@postgres:5432/app?sslmode=disable"
  catalogRpc: { apiKey: "catalog-rpc-key-0123456789ab" }
