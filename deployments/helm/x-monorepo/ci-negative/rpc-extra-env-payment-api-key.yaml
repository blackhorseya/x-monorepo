# expect: rpc.extraEnv
# The chart sets where rpc finds payment-rpc and with which key; extraEnv must not repoint or replace
# them (APP_PAYMENT_API_KEY). Refused whether or not payment-rpc is on.
rpc:
  extraEnv: [{"name": "APP_PAYMENT_API_KEY", "value": "x"}]
secrets:
  postgresUrl: "postgres://app:app@postgres:5432/app?sslmode=disable"
  catalogRpc: { apiKey: "catalog-rpc-key-0123456789ab" }
  paymentRpc: { apiKey: "payment-rpc-key-0123456789ab", mockWebhookSecret: "mock-webhook-secret-0123456789" }
config:
  ordering: { require_payment: false }
paymentRpc: { enabled: false }
