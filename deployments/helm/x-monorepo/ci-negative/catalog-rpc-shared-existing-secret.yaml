# expect: secrets.postgresUrl
# secrets.existingSecret is the release-wide Secret (it may hold rpc's JWT secret): it is not a
# Postgres source for catalog-rpc, so with an api key and no postgresUrl this still must not render.
catalogRpc: { enabled: true }
secrets:
  existingSecret: my-release-secret
  catalogRpc: { apiKey: "catalog-rpc-key-0123456789ab" }
