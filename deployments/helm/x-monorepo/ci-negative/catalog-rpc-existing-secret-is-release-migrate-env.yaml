# expect: secrets.catalogRpc.existingSecret
# The hook-scoped copy of the release Secret the migrate Job reads (<fullname>-migrate-env) holds the
# same Postgres URL and is just as much the release's as <fullname>-env.
catalogRpc: { enabled: true }
secrets:
  postgresUrl: "postgres://app:app@postgres:5432/app?sslmode=disable"
  catalogRpc: { existingSecret: t-x-monorepo-migrate-env }
