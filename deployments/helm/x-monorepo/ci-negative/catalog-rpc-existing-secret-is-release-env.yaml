# expect: secrets.catalogRpc.existingSecret
# secrets.existingSecret is EMPTY and the chart renders the release-wide Secret itself (<fullname>-env,
# here t-x-monorepo-env, because secrets.postgresUrl is set): naming that as catalog-rpc's own Secret
# points it at rpc's keys. The check compares the RESOLVED name, not the value of secrets.existingSecret.
catalogRpc: { enabled: true }
secrets:
  postgresUrl: "postgres://app:app@postgres:5432/app?sslmode=disable"
  catalogRpc: { existingSecret: t-x-monorepo-env }
