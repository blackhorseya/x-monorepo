# expect: secrets.paymentRpc.apiKey
# expect: config.ordering.require_payment=false
# expect: paymentRpc.enabled=false
# Auth is on, payment-rpc is on (the default) but it was given none of its secrets: refused, naming what to give and,
# for someone who does not want payment, the two values that turn it off.
secrets:
  postgresUrl: "postgres://app:app@postgres:5432/app?sslmode=disable"
  apiKeys: "ops=0123456789abcdef:admin"
  catalogRpc: { apiKey: "catalog-rpc-key-0123456789ab" }
config:
  auth: { mode: required }
paymentRpc:
  enabled: true
