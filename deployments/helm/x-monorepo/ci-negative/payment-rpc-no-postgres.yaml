# expect: paymentRpc.enabled needs secrets.postgresUrl
# Without a Postgres URL payment-rpc would serve from memory and lose its payments on restart.
paymentRpc: { enabled: true }
secrets:
  catalogRpc: { existingSecret: "my-catalog-rpc-secret" }
  paymentRpc: { apiKey: "payment-rpc-key-0123456789ab", mockWebhookSecret: "mock-webhook-secret-0123456789" }
