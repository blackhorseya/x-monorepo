# Applied on top of values.yaml by payment-flow.sh (docs/payment.md §9 S6): the release with ordering.require_payment ON.
# Every order that becomes CONFIRMED under it takes payment_required = true and is completed only through payment.
# The mock provider cannot be paid by a person, so payment-rpc's control entry (`payment-rpc mock pay|notify|fail`)
# is switched on here and nowhere else (the chart's default is off).
secrets:
  # Static credentials of the throwaway cluster: a customer (role-less) and an admin (seeds products and stock).
  apiKeys: "shopper=kind-shopper-key-0123456789ab,admin=kind-admin-key-0123456789abc:admin"
config:
  # With auth off nobody can pay (no credential, no customer): the chart refuses require_payment then.
  auth: { mode: required }
  ordering: { require_payment: true }
paymentRpc:
  config: { mock_control: true }
