# Postgres + Redis for a kind / minikube smoke install of the chart. NOT a production
# database: no volume (emptyDir), no auth beyond app/app, one replica. The chart itself has no
# dependency on these — production gets a managed Postgres / Redis and passes URLs in
# `secrets.*` — this file only exists so `task helm-kind` can install, migrate and consume
# for real. Service names match deployments/helm/kind/values.yaml.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          # What a failed run needs to explain a stall (#416): a wait for a lock past 1 s names the lock and who holds
          # it, checkpoints are logged. diag.sh passes this log through UNFILTERED, so the server must not write SQL
          # text into it (#420): no statement log; log_min_error_statement=panic, because a LOG line (the lock wait)
          # outranks ERROR and would otherwise carry a STATEMENT: line with the query; log_min_messages=log, because
          # an ERROR's DETAIL names values (a unique violation prints Key (col)=(value)). diag-test.sh D7 runs a real
          # Postgres with these flags and a synthetic credential in SQL.
          args: [-c, log_lock_waits=on, -c, deadlock_timeout=1s, -c, log_checkpoints=on, -c, log_min_messages=log, -c, log_min_error_statement=panic]
          env:
            - { name: POSTGRES_USER, value: app }
            - { name: POSTGRES_PASSWORD, value: app }
            - { name: POSTGRES_DB, value: app }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: [pg_isready, -U, app, -d, app] }
            periodSeconds: 2
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
      volumes: [{ name: data, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            exec: { command: [redis-cli, ping] }
            periodSeconds: 2
