# `task helm-kind`: the chart against deps.yaml inside a kind cluster, with images built from
# the working tree and `kind load`ed (never pulled). Redis broker so the forwarder path
# (outbox → Redis Streams → consumer) is the one exercised; console on so its nginx → rpc
# proxy is exercised too; everything else is the default.
image:
  registry: localhost/x-monorepo
  tag: kind
  pullPolicy: Never
secrets:
  postgresUrl: postgres://app:app@postgres:5432/app?sslmode=disable
  redisUrl: redis://redis:6379/0
  # catalog-rpc's own service key (rpc=<this>:admin); a throwaway value for the throwaway cluster.
  catalogRpc: { apiKey: kind-catalog-rpc-key-0123456789 }
  # payment-rpc's own service key (rpc=<this>:admin) and the mock provider's webhook secret: throwaway values.
  paymentRpc: { apiKey: kind-payment-rpc-key-0123456789, mockWebhookSecret: kind-mock-webhook-secret-0123456789 }
config:
  # The smoke / outage / negative scripts place orders without a credential and complete them by hand: the payment
  # switch is OFF here, explicitly (the chart default is ON). payment-flow.sh turns it on (payment-flow-values.yaml)
  # for the whole payment flow and restores this file on the way out. payment-rpc itself is on (paymentRpc below).
  ordering: { require_payment: false }
  http: { docs: true }
  # Dex from dex.yaml, reached through the CoreDNS rewrite (coredns-dex.sh). Plain http on a
  # non-loopback host, hence allow_insecure_issuer — dev only. The verifier is not on the request
  # path yet (#272); this only proves the config validates and the issuer resolves in the cluster.
  auth:
    oidc:
      enabled: true
      issuers:
        - issuer: http://dex.localtest.me:5556/dex
          audience: x-console
          mapping: bound
          allow_insecure_issuer: true
  worker: { broker: redis }
# catalog-rpc on, so the real install proves its own ConfigMap / Secret: this file's auth.oidc above
# is exactly what it refuses to start with, and the shared Secret would carry rpc's keys.
catalogRpc:
  enabled: true
  replicaCount: 1
  resources:
    requests: { cpu: 10m, memory: 32Mi }
rpc:
  replicaCount: 1
  # the kind stack waits for the catalog for this long (outage.sh makes it wait the whole time, so keep it short)
  waitForCatalog: { timeoutSeconds: 20 }
  resources:
    requests: { cpu: 10m, memory: 32Mi }
worker:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
console:
  enabled: true
# payment-rpc on (docs/payment.md, slice 5c): serve, consume and the expire CronJob on their own ConfigMap and
# Secret, the Postgres broker although this release's worker uses Redis, and the webhook-only Ingress that
# payment.sh drives through an ingress-nginx it installs (the controller is not part of the chart). The rate
# limit is low on purpose so payment.sh can hit it with a handful of requests. ordering.require_payment stays
# false (the default): nothing in the order flow waits for payment.
paymentRpc:
  enabled: true
  serve:
    replicaCount: 1
    resources:
      requests: { cpu: 10m, memory: 32Mi }
  consume:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
  expire:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: pay.localtest.me
    rateLimit: { rps: 2, burstMultiplier: 2, connections: 5 }
