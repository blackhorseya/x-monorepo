# `task helm-kind`: the chart against deps.yaml inside a kind cluster, with images built from
# the working tree and `kind load`ed (never pulled). Redis broker so the forwarder path
# (outbox → Redis Streams → consumer) is the one exercised; console on so its nginx → rpc
# proxy is exercised too; everything else is the default.
image:
  registry: localhost/x-monorepo
  tag: kind
  pullPolicy: Never
secrets:
  postgresUrl: postgres://app:app@postgres:5432/app?sslmode=disable
  redisUrl: redis://redis:6379/0
config:
  http: { docs: true }
  # Dex from dex.yaml, reached through the CoreDNS rewrite (coredns-dex.sh). Plain http on a
  # non-loopback host, hence allow_insecure_issuer — dev only. The verifier is not on the request
  # path yet (#272); this only proves the config validates and the issuer resolves in the cluster.
  auth:
    oidc:
      enabled: true
      issuers:
        - issuer: http://dex.localtest.me:5556/dex
          audience: x-console
          mapping: bound
          allow_insecure_issuer: true
  worker: { broker: redis }
rpc:
  replicaCount: 1
  resources:
    requests: { cpu: 10m, memory: 32Mi }
worker:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
console:
  enabled: true
