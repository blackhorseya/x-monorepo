# Local infrastructure only — the apps run on the host (`task run`, `task migrate -- up`).
#   task compose-up        # podman compose (docker compose if no podman) ... up -d
#   task compose-down      # ... down -v   (drops the volumes)
# configs/local.yaml (seeded from config.example.yaml) points postgres.url and otel.endpoint
# here → task migrate -- up → task run → Grafana at http://localhost:3000 (anonymous admin),
# dashboard "x-monorepo / service" provisioned from ./grafana/dashboards.
name: x-monorepo

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Broker for `worker.broker: redis` (Redis Streams). Optional: the default broker is
  # the Postgres outbox tables themselves. AOF on, because once the worker's forwarder
  # has copied a message out of the outbox it exists only here.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Grafana + Loki + Tempo + Prometheus(Mimir) + an OTel collector in one container.
  # Apps export OTLP/gRPC to :4317; otel.endpoint in configs/local.yaml already points here.
  lgtm:
    image: grafana/otel-lgtm:0.37.0
    # Retention, via the image's *_EXTRA_ARGS hooks (run-*.sh): a laptop stack otherwise keeps
    # everything forever (Loki/Tempo default: no deletion / 14d). Pyroscope here is v2 storage,
    # whose time-based retention has no flag yet. Loki also needs a delete-request store once
    # retention is on, and it refuses writes (503) when the *VM disk* is nearly full — if Loki
    # goes quiet, check `podman machine ssh df -h /` before anything else.
    environment:
      LOKI_EXTRA_ARGS: "-compactor.retention-enabled=true -compactor.delete-request-store=filesystem -store.retention=${LGTM_RETENTION:-72h}"
      TEMPO_EXTRA_ARGS: "-backend-worker.compaction.block-retention=${LGTM_RETENTION:-72h} -backend-scheduler.provider.work.compaction.block-retention=${LGTM_RETENTION:-72h}"
      PROMETHEUS_EXTRA_ARGS: "--storage.tsdb.retention.time=${LGTM_RETENTION:-72h}"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - lgtm-grafana:/data/grafana
      - lgtm-prometheus:/data/prometheus
      - lgtm-loki:/data/loki
      - lgtm-tempo:/data/tempo
      # Dashboards are provisioned from the repo (folder "x-monorepo"). Edit in the UI → Export →
      # commit the JSON → `task grafana-reload` (inotify does not cross the macOS bind mount).
      - ./grafana/provisioning/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/x-monorepo.yaml:ro
      - ./grafana/dashboards:/otel-lgtm/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  redisdata:
  lgtm-grafana:
  lgtm-prometheus:
  lgtm-loki:
  lgtm-tempo:
