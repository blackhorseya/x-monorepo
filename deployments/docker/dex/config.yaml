# Dev-only OIDC IdP (docs/identity-login.md §10). One file for both environments:
#   compose  mounted into the `dex` service (deployments/docker/docker-compose.yaml)
#   kind     `task dex-kind` loads it into ConfigMap dex (deployments/helm/kind/dex.yaml)
# The issuer is the same string everywhere, so a token minted in the browser verifies inside the
# cluster: http://dex.localtest.me:5556/dex. *.localtest.me resolves to 127.0.0.1 on public DNS;
# containers get there through compose `extra_hosts` / kind CoreDNS, offline through /etc/hosts
# (docs/operations.md "Dex dev IdP"). NOT for production: in-memory storage, two fixed accounts
# with a published password, no TLS.
issuer: http://dex.localtest.me:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  # Console is the only client; skip the "grant access" page so the login E2E is one form.
  skipApprovalScreen: true

enablePasswordDB: true

staticClients:
  # `id` is what auth.oidc.issuers[].audience must be. Public client = PKCE, no secret (§3).
  - id: x-console
    name: x-monorepo console
    public: true
    redirectURIs:
      - http://localhost:5173/auth/callback   # task web-dev (vite)
      - http://localhost:4173/auth/callback   # vite preview (Playwright)
      - http://localhost:8080/auth/callback   # console image / kind port-forward

staticPasswords:
  # Both passwords are "password". Dex hashes are bcrypt; Dex marks email_verified=true for
  # these, which the invite flow requires. `sub` is derived from userID + connector, so it is
  # stable across restarts and identical in compose and kind.
  - email: admin@example.com
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: admin
    userID: 08a8684b-db88-4b73-90a9-3cd1661f5466
  - email: user@example.com
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: user
    userID: 41331323-6f44-45e6-b3b9-2c4b60c02be5
