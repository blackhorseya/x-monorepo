# https://taskfile.dev — single source of truth for every check.
# Claude Code hooks (.claude/settings.json), lefthook and CI only call tasks here;
# none of them carry logic of their own.
#
#   gate-fast   seconds   fmt + vet + depguard on the module(s) owning FILE   (PostToolUse / pre-commit)
#   gate-local  ~1 min    gen freshness + {{.BUF}} lint + affected tests           (Stop hook / pre-push)
#   gate-ci     full      everything, authoritative                          (GitHub Actions)
version: '3'

vars:
  BIN_DIR: '{{.ROOT_DIR}}/bin'
  # Prefer the pinned binaries from `task tools`; fall back to PATH (CI installs buf /
  # golangci-lint via actions). OS env wins over Taskfile env, so PATH cannot be prepended here.
  BUF:
    sh: '[ -x {{.BIN_DIR}}/buf ] && echo {{.BIN_DIR}}/buf || echo buf'
  WIRE:
    sh: '[ -x {{.BIN_DIR}}/wire ] && echo {{.BIN_DIR}}/wire || echo wire'
  GOLANGCI_LINT:
    sh: '[ -x {{.BIN_DIR}}/golangci-lint ] && echo {{.BIN_DIR}}/golangci-lint || echo golangci-lint'
  # Container runtime for local infra: podman first, docker as fallback.
  COMPOSE:
    sh: 'command -v podman >/dev/null 2>&1 && echo "podman compose" || echo "docker compose"'
  # Config file `task run` / `task migrate` load (APP_CONFIG). Gitignored; seeded from
  # configs/config.example.yaml on first use. Override: task run CONFIG=<file>
  CONFIG: '{{.CONFIG | default (printf "%s/configs/local.yaml" .ROOT_DIR)}}'

  BUF_VERSION: v1.74.0
  PROTOC_GEN_GO_VERSION: v1.36.12
  PROTOC_GEN_CONNECT_GO_VERSION: v1.21.1
  WIRE_VERSION: v0.7.0
  GOLANGCI_LINT_VERSION: v2.14.0
  LEFTHOOK_VERSION: v2.2.2
  CONNECT_OPENAPI_VERSION: v0.28.0
  GORELEASER_VERSION: v2.18.2   # .github/workflows/release.yml pins the same minor
  KUBECONFORM_VERSION: v0.7.0   # helm-check; helm itself comes from PATH (brew install helm)

  # Bounded contexts that publish an OpenAPI document (pkgs/<bc>/contract/v1/openapi.yaml).
  BCS: ordering inventory identity catalog
  # Every Go module in the workspace (keep in sync with go.work).
  MODULES: pkgs/kernel pkgs/platform pkgs/ordering pkgs/inventory pkgs/identity pkgs/catalog apps/rpc apps/migrate apps/worker tools/stripvalidate
  APPS: rpc migrate worker

tasks:
  default:
    cmds: [task --list]
    silent: true

  all:
    desc: gen → wire → lint → test → build
    cmds:
      - task: gen
      - task: wire
      - task: lint
      - task: test
      - task: build

  # ── Gates ───────────────────────────────────────────────────────────────────

  affected:
    desc: print modules touched by the current change (scripts/affected.sh)
    cmds: [scripts/affected.sh]
    silent: true

  gate-fast:
    desc: 'gofmt + vet + golangci-lint --fast-only + archtest on the modules owning the given files'
    summary: |
      task gate-fast FILE="a.go b.go"     # or
      task gate-fast -- a.go b.go         # lefthook passes {staged_files} this way (no shell quoting)
    vars:
      FILES: '{{.FILE | default .CLI_ARGS}}'
    preconditions:
      - sh: test -n "{{.FILES}}"
        msg: 'usage: task gate-fast FILE="<path>..."  |  task gate-fast -- <path>...'
    silent: true
    cmds:
      - |
        bad=$(gofmt -l $(echo "{{.FILES}}" | tr ' ' '\n' | grep '\.go$' || true))
        if [ -n "$bad" ]; then echo "gofmt: $bad"; exit 1; fi
      - |
        for m in $(scripts/affected.sh --files {{.FILES}}); do
          echo ">> $m"
          (cd "$m" && go vet ./...) || exit 1
          if [ -x {{.BIN_DIR}}/golangci-lint ] || command -v golangci-lint >/dev/null; then (cd "$m" && {{.GOLANGCI_LINT}} run --fast-only ./...) || exit 1; fi
          # DDD rules (archtest) are an AST walk, ~1s: cheap enough to report on every edit.
          if [ -f "$m/arch_test.go" ]; then (cd "$m" && go test -count=1 -run '^TestArchitecture$' .) || exit 1; fi
        done

  gate-local:
    desc: what the agent / pre-push must pass before claiming "done"
    cmds:
      - task: check-gen-fresh
      - '{{.BUF}} lint'
      - task: test-affected

  gate-ci:
    desc: everything (CI runs the pieces as separate jobs; this is the local equivalent)
    cmds:
      - task: check-gen-fresh
      - task: check-work-sync
      - task: lint
      - task: test
      - task: cover-gate
      - task: build
      - task: helm-check
      - task: scripts-test

  scripts-test:
    desc: 'scripts/test.sh: the CI / release decision scripts (ci-changes, releasable, next-version, release-gate-pr, merge-ready with a stubbed gh, merge-tree-check) against throwaway git repos, and red-stage against sample go test output'
    cmds:
      - scripts/test.sh

  merge-ready:
    desc: 'before merging: is the PR green on main-as-of-now + its head? (task merge-ready -- 188 [--revalidate]; scripts/merge-ready.sh)'
    cmds:
      - scripts/merge-ready.sh {{.CLI_ARGS}}

  test-affected:
    desc: go test -race on affected modules only
    silent: true
    cmds:
      - |
        mods=$(scripts/affected.sh)
        [ -n "$mods" ] || { echo "nothing affected"; exit 0; }
        for m in $mods; do echo ">> $m"; (cd "$m" && go test -race ./...) || exit 1; done

  cover-gate:
    desc: domain packages must be 100% covered
    cmds: [scripts/cover-gate.sh]

  check-gen-fresh:
    desc: regenerating must produce no diff — Go / OpenAPI / Wire only, NOT TS (use check-gen-fresh-all for TS freshness)
    cmds:
      - task: gen
      - task: wire
      - |
        git diff --quiet -- '*.pb.go' '*.connect.go' '*wire_gen.go' '*/contract/*/openapi.yaml' || {
          echo "generated code is stale — commit the result of: task gen wire"
          git --no-pager diff --stat -- '*.pb.go' '*.connect.go' '*wire_gen.go' '*/contract/*/openapi.yaml'
          exit 1
        }

  check-gen-fresh-all:
    desc: the CI gen-freshness job runs exactly this — task gen wire gen-ts, then any unstaged diff fails (same scope as CI's `git diff --exit-code`, incl. TS; stage your changes first; needs network)
    cmds:
      - task: gen
      - task: wire
      - task: gen-ts
      - |
        git diff --quiet || {
          echo "generated code is stale — commit the result of: task gen wire gen-ts"
          git --no-pager diff --stat
          exit 1
        }

  check-work-sync:
    desc: go.work and every go.mod agree
    cmds:
      - go work sync
      - |
        git diff --quiet -- go.work '*/go.mod' '*/*/go.mod' || { echo "go.mod drift — commit the result of: go work sync"; exit 1; }

  # ── Tooling / codegen ───────────────────────────────────────────────────────

  tools:
    desc: install codegen tools into ./bin (pinned versions)
    env: { GOBIN: '{{.BIN_DIR}}' }
    cmds:
      - go install github.com/bufbuild/buf/cmd/buf@{{.BUF_VERSION}}
      - go install google.golang.org/protobuf/cmd/protoc-gen-go@{{.PROTOC_GEN_GO_VERSION}}
      - go install connectrpc.com/connect/cmd/protoc-gen-connect-go@{{.PROTOC_GEN_CONNECT_GO_VERSION}}
      - go install github.com/google/wire/cmd/wire@{{.WIRE_VERSION}}
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
      - go install github.com/sudorandom/protoc-gen-connect-openapi@{{.CONNECT_OPENAPI_VERSION}}
      - go install github.com/yannh/kubeconform/cmd/kubeconform@{{.KUBECONFORM_VERSION}}
      - chmod +x scripts/*.sh scripts/hooks/*.sh deployments/helm/check.py

  tools:hooks:
    desc: install lefthook into ./bin and register the git hooks (humans only; CI never needs it)
    env: { GOBIN: '{{.BIN_DIR}}' }
    cmds:
      - go install github.com/evilmartians/lefthook/v2@{{.LEFTHOOK_VERSION}}
      - '{{.BIN_DIR}}/lefthook install'

  gen:
    desc: protos → each module's contract/ (Go) + OpenAPI
    # buf.gen.yaml has no clean:true because contract/ dirs also hold hand-written
    # helpers; stale generated files are removed first.
    cmds:
      - '{{.BUF}} format -w'
      - find pkgs -name '*.pb.go' -delete
      - find pkgs -path '*connect/*.connect.go' -delete
      - '{{.BUF}} generate'
      - task: gen-openapi

  gen-openapi:
    desc: per-BC OpenAPI (Connect semantics) → pkgs/<bc>/contract/v1/openapi.yaml (+ platform's admin.v1)
    cmds:
      - >-
        {{.BUF}} generate --path protos/admin --template
        '{"version":"v2","plugins":[{"local":"bin/protoc-gen-connect-openapi","out":"pkgs/platform/contract/admin/v1","opt":["path=openapi.yaml","base=protos/admin/v1/openapi.base.yaml"]}]}'
      - for: { var: BCS }
        cmd: >-
          {{.BUF}} generate --path protos/{{.ITEM}} --template
          '{"version":"v2","plugins":[{"local":"bin/protoc-gen-connect-openapi","out":"pkgs/{{.ITEM}}/contract/v1","opt":["path=openapi.yaml","base=protos/{{.ITEM}}/v1/openapi.base.yaml"]}]}'

  gen-ts:
    desc: protos → web/packages/proto (remote plugin, needs network)
    cmds:
      # tools/stripvalidate drops buf.validate's rule options and validate.proto (~70 kB of
      # descriptor in the console bundle), keeping only Violations; see web/packages/proto/README.md.
      # --include-imports emits that kept file (buf/validate/violations.proto); WKT are skipped.
      - |
        set -o pipefail
        {{.BUF}} build -o - | go run ./tools/stripvalidate | {{.BUF}} generate --template buf.gen.ts.yaml --include-imports -

  wire:
    desc: regenerate DI graph for every app
    cmds:
      - for: { var: APPS }
        cmd: '{{.WIRE}} gen ./apps/{{.ITEM}}'

  # ── Quality ─────────────────────────────────────────────────────────────────
  # The go.work root is not a module, so `./...` matches nothing there: loop per module.

  lint:
    desc: proto lint + go vet + golangci-lint (depguard enforces layer / BC boundaries)
    cmds:
      - '{{.BUF}} lint'
      - for: { var: MODULES }
        cmd: echo ">> {{.ITEM}}" && cd {{.ITEM}} && go vet ./... && {{.GOLANGCI_LINT}} run ./...

  breaking:
    desc: detect wire-incompatible proto changes against main
    cmds: ["{{.BUF}} breaking --against '.git#branch=main'"]

  test:
    desc: go test -race, every module
    cmds:
      - for: { var: MODULES }
        cmd: echo ">> {{.ITEM}}" && cd {{.ITEM}} && go test -race ./...

  test-bin:
    desc: compile test binaries into ./bin/test/
    cmds:
      - mkdir -p {{.BIN_DIR}}/test
      - for: { var: MODULES }
        cmd: cd {{.ITEM}} && go test -c -o {{.BIN_DIR}}/test/ ./...

  cover:
    desc: coverage summary per module
    silent: true
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - for: { var: MODULES }
        cmd: |
          prof={{.BIN_DIR}}/coverage-$(echo {{.ITEM}} | tr / _).out
          (cd {{.ITEM}} && go test -coverprofile="$prof" ./... >/dev/null)
          printf '%-16s ' {{.ITEM}}; go tool cover -func="$prof" | tail -1

  # ── Build / run ─────────────────────────────────────────────────────────────

  build:
    desc: build every app into ./bin
    cmds:
      - for: { var: APPS }
        cmd: go build -o {{.BIN_DIR}}/{{.ITEM}} ./apps/{{.ITEM}}

  helm-check:
    desc: 'lint + render + schema-check deployments/helm/x-monorepo under every ci/ profile, then deployments/helm/check.py asserts the derived shutdown / hook / prune numbers'
    vars:
      CHART: deployments/helm/x-monorepo
      KUBECONFORM:
        sh: '[ -x {{.BIN_DIR}}/kubeconform ] && echo {{.BIN_DIR}}/kubeconform || echo kubeconform'
      PROFILES:
        sh: ls {{.CHART}}/ci/*.yaml
    cmds:
      - for: { var: PROFILES }
        cmd: |
          helm lint --strict {{.CHART}} -f {{.ITEM}} >/dev/null
          helm template t {{.CHART}} -f {{.ITEM}} | {{.KUBECONFORM}} -strict -summary -kubernetes-version 1.30.0 -schema-location default -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{"{{"}}.Group{{"}}"}}/{{"{{"}}.ResourceKind{{"}}"}}_{{"{{"}}.ResourceAPIVersion{{"}}"}}.json' >/dev/null
          helm template t {{.CHART}} -f {{.ITEM}} | deployments/helm/check.py {{.ITEM}}
    preconditions:
      - sh: command -v helm >/dev/null
        msg: helm not found (brew install helm)

  helm-kind-up:
    deps: [web-build]
    desc: 'the shared base of helm-kind and helm-kind-keda: kind cluster (reused if it exists), images built from the tree (rpc / worker / migrate + the console on web-build) and kind-loaded, namespace, deployments/helm/kind/deps.yaml (Postgres, Redis) rolled out. CI runs the two on separate clusters in parallel, so each one needs this on its own'
    vars:
      CLUSTER: x-monorepo
      NS: x-monorepo
      CHART: deployments/helm/x-monorepo
      KIND_DIR: deployments/helm/kind
      ARCH:
        sh: go env GOARCH
      DOCKER:
        sh: 'command -v docker >/dev/null && echo docker || echo podman'
    cmds:
      - kind get clusters 2>/dev/null | grep -qx {{.CLUSTER}} || kind create cluster --name {{.CLUSTER}} --wait 2m
      - for: [rpc, worker, migrate]
        cmd: CGO_ENABLED=0 GOOS=linux GOARCH={{.ARCH}} go build -trimpath -o {{.BIN_DIR}}/kind/linux/{{.ARCH}}/{{.ITEM}} ./apps/{{.ITEM}}
      # Same Dockerfile as the release (context layout <os>/<arch>/<app>); TARGETPLATFORM is set by
      # hand because plain `docker build` / podman do not inject it the way buildx does.
      # `localhost/` prefix: podman qualifies bare names with it anyway, so this is the one
      # spelling docker, podman and the archive loaded into kind all agree on.
      - for: [rpc, worker, migrate]
        cmd: '{{.DOCKER}} build -q -f deployments/docker/Dockerfile --build-arg APP={{.ITEM}} --build-arg TARGETPLATFORM=linux/{{.ARCH}} -t localhost/x-monorepo/{{.ITEM}}:kind {{.BIN_DIR}}/kind >/dev/null'
      # The console: nginx + web/apps/console/dist (built by the web-build dep), context = that dir.
      - '{{.DOCKER}} build -q -t localhost/x-monorepo/console:kind web/apps/console >/dev/null'
      - '{{.DOCKER}} save -o {{.BIN_DIR}}/kind/images.tar localhost/x-monorepo/rpc:kind localhost/x-monorepo/worker:kind localhost/x-monorepo/migrate:kind localhost/x-monorepo/console:kind'
      - kind load image-archive --name {{.CLUSTER}} {{.BIN_DIR}}/kind/images.tar
      - kubectl create namespace {{.NS}} --dry-run=client -o yaml | kubectl apply -f - >/dev/null
      - kubectl -n {{.NS}} apply -f {{.KIND_DIR}}/deps.yaml >/dev/null
      - kubectl -n {{.NS}} rollout status deploy/postgres deploy/redis --timeout=2m
    preconditions:
      - sh: command -v kind >/dev/null && command -v kubectl >/dev/null && command -v helm >/dev/null && command -v jq >/dev/null
        msg: needs kind, kubectl, helm, jq (brew install kind kubectl helm jq)

  helm-kind:
    deps: [helm-kind-up]
    desc: 'install the chart for real on the helm-kind-up cluster: helm upgrade --install --wait twice (pre-install then pre-upgrade hook), each followed by deployments/helm/kind/smoke.sh (an order reserves stock through the worker; the console serves the UI and proxies /api). helm-kind-down deletes the cluster'
    vars:
      NS: x-monorepo
      CHART: deployments/helm/x-monorepo
      KIND_DIR: deployments/helm/kind
    cmds:
      - helm upgrade --install x-monorepo {{.CHART}} -n {{.NS}} -f {{.KIND_DIR}}/values.yaml --wait --timeout 3m >/dev/null
      - '{{.KIND_DIR}}/smoke.sh {{.NS}} x-monorepo'
      # Second pass is an upgrade: pre-upgrade hook re-runs migrate (no-op), pods roll, release stays ready.
      - helm upgrade --install x-monorepo {{.CHART}} -n {{.NS}} -f {{.KIND_DIR}}/values.yaml --wait --timeout 3m >/dev/null
      - '{{.KIND_DIR}}/smoke.sh {{.NS}} x-monorepo'
      - helm -n {{.NS}} status x-monorepo | head -5
    preconditions:
      - sh: command -v kind >/dev/null && command -v kubectl >/dev/null && command -v helm >/dev/null && command -v jq >/dev/null
        msg: needs kind, kubectl, helm, jq (brew install kind kubectl helm jq)

  helm-kind-keda:
    deps: [helm-kind-up]
    desc: 'on the helm-kind-up cluster (independent of helm-kind, CI runs both in parallel): KEDA + deployments/helm/kind/monitoring.yaml (OTLP collector → Prometheus), the chart re-installed with kind/keda-values.yaml (worker.autoscaling lag), then kind/scale.sh floods orders with k6 and expects the worker to scale out on eventbus_consumer_lag and back'
    vars:
      NS: x-monorepo
      CHART: deployments/helm/x-monorepo
      KIND_DIR: deployments/helm/kind
      KEDA_VERSION: 2.21.0
    cmds:
      - helm repo add kedacore https://kedacore.github.io/charts >/dev/null 2>&1 || true
      - helm upgrade --install keda kedacore/keda -n keda --create-namespace --version {{.KEDA_VERSION}} --wait --timeout 3m >/dev/null
      - kubectl -n {{.NS}} apply -f {{.KIND_DIR}}/monitoring.yaml >/dev/null
      - kubectl -n {{.NS}} rollout status deploy/otel-collector deploy/prometheus --timeout=2m
      - helm upgrade --install x-monorepo {{.CHART}} -n {{.NS}} -f {{.KIND_DIR}}/values.yaml -f {{.KIND_DIR}}/keda-values.yaml --wait --timeout 3m >/dev/null
      - '{{.KIND_DIR}}/scale.sh {{.NS}} x-monorepo'
    preconditions:
      - sh: command -v k6 >/dev/null && command -v jq >/dev/null
        msg: needs k6 and jq

  helm-kind-down:
    desc: delete the kind cluster created by helm-kind
    cmds: [kind delete cluster --name x-monorepo]

  k6:
    desc: 'one k6 script against a running server (default http://127.0.0.1:8080, i.e. task run): task k6 -- orders|ratelimit|timeout|reservation [k6 args…]; BASE_URL / API_KEY / ADMIN_API_KEY (setup SetStock, admin role when auth is on) / VUS / DURATION / RPS are read from the environment (k6 __ENV), see the headers of tests/k6/*.js'
    cmds:
      - 'k6 run tests/k6/{{index (splitArgs .CLI_ARGS) 0}}.js {{slice (splitArgs .CLI_ARGS) 1 | join " "}}'
    preconditions:
      - sh: command -v k6 >/dev/null
        msg: k6 not found (brew install k6)

  k6-auth-matrix:
    desc: 'tests/k6/auth-matrix.sh: orders.js and reservation.js (2 VU, 5s) against a real ./bin/rpc + ./bin/worker + Postgres (DATABASE_URL) in every auth state — auth on with a role-less key / an admin key, auth off with no key / a key sent — plus the per-procedure-public and fails-once fixtures. Each cell has its own RUN_ID; task k6-auth-matrix -- <cell…> runs some. The `k6-auth` job in CI'
    cmds: ['tests/k6/auth-matrix.sh {{.BIN_DIR}} {{.CLI_ARGS}}']
    preconditions:
      - sh: command -v k6 >/dev/null && command -v python3 >/dev/null
        msg: needs k6 (brew install k6) and python3

  k6-wire:
    desc: 'tests/k6/wire.sh: the four k6 scripts against tests/k6/wire_server.py, which answers with a broken HTTP response (status code / version / header line / chunk quoting the request X-API-Key, a truncated body, a closed connection) — each run must fail, and the key must be in none of k6 output, --summary-export or --out json (no Postgres, no rpc, ~1 min). The `k6-auth` job in CI'
    cmds: ['tests/k6/wire.sh {{.BIN_DIR}} {{.CLI_ARGS}}']
    preconditions:
      - sh: command -v k6 >/dev/null && command -v python3 >/dev/null
        msg: needs k6 (brew install k6) and python3

  k6-bench:
    desc: 'tests/k6/bench.sh: the performance baseline (#263) — CreateOrder throughput/latency at saturation and order → RESERVED latency through the worker, RUNS (3) times with fixed parameters, each run in its own Postgres database (created on the server of DATABASE_URL, migrated, dropped after). Writes {{.BIN_DIR}}/k6-bench/<stamp>/{result.json,summary.md} (median, min–max, CV; commit, Go/Postgres/k6, CPU, parameters). Needs psql and CREATE DATABASE. Not in CI: docs/perf-baseline.md'
    deps: [build]
    cmds: ['tests/k6/bench.sh {{.BIN_DIR}} {{.CLI_ARGS}}']
    preconditions:
      - sh: command -v k6 >/dev/null && command -v psql >/dev/null && command -v python3 >/dev/null
        msg: needs k6 (brew install k6), psql and python3

  k6-bench-test:
    desc: 'tests of the bench tooling: bench_report_test.py (throughput and drain definitions), bench_fixture_test.sh (seeded SKUs, end-to-end latency includes CreateOrder, throughput not diluted by setup — against tests/k6/bench_stub.py), bench_db_test.sh (bench.sh never drops a database it did not create). Needs Postgres (DATABASE_URL), k6 and psql; not in CI'
    deps: [build]
    cmds:
      - 'python3 -I tests/k6/bench_report_test.py'
      - 'tests/k6/bench_fixture_test.sh'
      - 'tests/k6/bench_drain_test.sh'
      - 'tests/k6/bench_overload_test.sh'
      - 'tests/k6/bench_db_test.sh {{.BIN_DIR}}'
    preconditions:
      - sh: command -v k6 >/dev/null && command -v psql >/dev/null && command -v python3 >/dev/null
        msg: needs k6 (brew install k6), psql and python3

  k6-smoke:
    desc: 'tests/k6/smoke.sh: the four k6 scripts, short, each against its own ./bin/rpc on :18090 with the local Postgres (DATABASE_URL) — load thresholds, rate limit at 50 rps, timeout at 1ns, reservation with a ./bin/worker next to the rpc. What CI runs'
    deps: [build]
    cmds: ['tests/k6/smoke.sh {{.BIN_DIR}} {{.CLI_ARGS}}']
    preconditions:
      - sh: command -v k6 >/dev/null
        msg: k6 not found (brew install k6)

  release-check:
    desc: validate .goreleaser.yaml (goreleaser from PATH; brew install goreleaser)
    cmds: [goreleaser check]

  release-snapshot:
    desc: 'dry-run release into bin/dist: every binary + archive, no images (needs docker buildx), no signing (needs the CI OIDC token), no publish'
    cmds: ["goreleaser release --snapshot --clean --skip=docker,publish,sign"]

  release-gate:
    desc: 'what release.yml would do with HEAD: the files changed since the last v* tag that reach an artifact (scripts/releasable.sh; none = no release) and the version release-drafter would resolve from the commit titles (scripts/next-version.sh)'
    silent: true
    cmds:
      - |
        files=$(scripts/releasable.sh {{.CLI_ARGS}})
        if [ -z "$files" ]; then echo "no release: nothing releasable in that range"; exit 0; fi
        echo "$files"
        echo "→ release $(scripts/next-version.sh {{.CLI_ARGS}})"

  release-verify:
    desc: 'scripts/release-verify.sh vX.Y.Z: verify a published release the way its notes say (checksums bundle, archive attestation, four image signatures; needs gh + cosign + ghcr login)'
    cmds:
      - scripts/release-verify.sh {{.CLI_ARGS}}

  run:
    desc: 'build and run ./bin/rpc with configs/local.yaml (gitignored; seeded from the example); task run CONFIG=<file> to use another'
    deps: [build, config]
    env: { APP_CONFIG: '{{.CONFIG}}' }
    cmds: ['{{.BIN_DIR}}/rpc']

  worker:
    desc: 'build and run ./bin/worker (event consumers) with configs/local.yaml; needs postgres.url'
    deps: [build, config]
    env: { APP_CONFIG: '{{.CONFIG}}' }
    cmds: ['{{.BIN_DIR}}/worker']

  poison:
    desc: 'task poison -- list|show|requeue|drop … → operate a BC''s poison table via ./bin/worker poison (task poison -- --help)'
    deps: [build, config]
    preconditions:
      - sh: test -n "{{.CLI_ARGS}}"
        msg: 'usage: task poison -- list [-n 50] [<bc>] | show <bc> <offset> | requeue <bc> <offset>...|all | drop <bc> <offset>...|all'
    env: { APP_CONFIG: '{{.CONFIG}}' }
    cmds: ['{{.BIN_DIR}}/worker poison {{.CLI_ARGS}}']

  expire:
    desc: 'task expire -- --older-than 24h [--dry-run] [--batch N] → reservation TTL: release RESERVED reservations held longer than this and ask ordering to cancel, via ./bin/worker expire'
    deps: [build, config]
    preconditions:
      - sh: test -n "{{.CLI_ARGS}}"
        msg: 'usage: task expire -- --older-than <duration> [--dry-run] [--batch N]   (start with --dry-run)'
    env: { APP_CONFIG: '{{.CONFIG}}' }
    cmds: ['{{.BIN_DIR}}/worker expire {{.CLI_ARGS}}']

  bootstrap:
    desc: 'task bootstrap [-- --name root --role admin --key-name bootstrap --expires-in 720h] → identity''s first account + API key on an empty store, secret printed once, via ./bin/worker bootstrap (local development database only: --insecure-allow-plaintext skips the TLS check; --expect-target pins the compose Postgres, 127.0.0.1:$POSTGRES_PORT, default 5432)'
    deps: [build, config]
    env: { APP_CONFIG: '{{.CONFIG}}' }
    cmds: ['{{.BIN_DIR}}/worker bootstrap --insecure-allow-plaintext --expect-target "127.0.0.1:${POSTGRES_PORT:-5432}" {{.CLI_ARGS}}']

  prune:
    desc: 'task prune -- --older-than 720h [--dry-run] [--unconsumed] [<bc>] → delete acked outbox rows + consumed inbox rows via ./bin/worker prune'
    deps: [build, config]
    preconditions:
      - sh: test -n "{{.CLI_ARGS}}"
        msg: 'usage: task prune -- --older-than <duration> [--dry-run] [--unconsumed] [<bc>]   (start with --dry-run)'
    env: { APP_CONFIG: '{{.CONFIG}}' }
    cmds: ['{{.BIN_DIR}}/worker prune {{.CLI_ARGS}}']

  # ── Web (web/: pnpm + Turborepo) ────────────────────────────────────────────

  web-install:
    desc: 'pnpm install for web/ (frozen lockfile); re-runs only when the lockfile or a package.json changes'
    dir: web
    sources: [pnpm-lock.yaml, package.json, '*/*/package.json']
    generates: [node_modules/.modules.yaml]
    cmds: [pnpm install --frozen-lockfile]

  web-dev:
    desc: 'console on http://localhost:5173, proxying RPCs to CONSOLE_API (default http://localhost:8080 = task run)'
    deps: [web-install]
    dir: web/apps/console
    cmds: [pnpm dev]

  web-typecheck:
    desc: tsc --noEmit for every web package (@repo/proto, @repo/console)
    deps: [web-install]
    dir: web
    cmds: [pnpm typecheck]

  web-build:
    desc: production build of web/apps/console → web/apps/console/dist
    deps: [web-install]
    dir: web
    cmds: [pnpm build]

  web-e2e:
    desc: 'Playwright smoke of the console against a real ./bin/rpc + vite preview of the build; E2E_DATABASE_URL=postgres://… runs migrate up and uses that DB (what CI does), unset = in-memory; once: pnpm exec playwright install chromium (web/apps/console)'
    deps: [build, web-build]
    dir: web/apps/console
    cmds: ['pnpm exec playwright test {{.CLI_ARGS}}']

  web-e2e-image:
    desc: 'the chromium e2e project against the real console image: build web/apps/console/Dockerfile (docker or podman), run it with RPC_UPSTREAM back to the host, Playwright starts bin/rpc as usual; also runs e2e/image.spec.ts (nginx: SPA fallback, cache headers, /api proxy, /healthz). What CI''s console-image job runs'
    deps: [build, web-build]
    cmds: ['web/apps/console/e2e/image.sh {{.CLI_ARGS}}']

  config:
    desc: 'create configs/local.yaml from configs/config.example.yaml if missing'
    status: ['test -f {{.CONFIG}}']
    cmds:
      - cp configs/config.example.yaml {{.CONFIG}}
      - 'echo "seeded {{.CONFIG}} from configs/config.example.yaml — edit it, it is gitignored"'

  migrate:
    desc: 'task migrate -- up|down|version → every BC''s migrations against postgres.url of configs/local.yaml (or CONFIG=<file> / APP_POSTGRES_URL)'
    deps: [config]
    preconditions:
      - sh: test -n "{{.CLI_ARGS}}"
        msg: 'usage: task migrate -- up|down|version'
    env: { APP_CONFIG: '{{.CONFIG}}' }
    cmds:
      - go run ./apps/migrate {{.CLI_ARGS}}

  # ── Local infrastructure ────────────────────────────────────────────────────

  compose-up:
    desc: 'start local infra (Postgres :5432 user/pass/db=app; otel-lgtm: Grafana :3000, OTLP :4317) — apps run on the host'
    cmds:
      - '{{.COMPOSE}} -f deployments/docker/docker-compose.yaml up -d'

  grafana-reload:
    desc: restart otel-lgtm so Grafana re-reads deployments/docker/grafana/{dashboards/*.json,provisioning/alerting.yaml}
    cmds:
      - '{{.COMPOSE}} -f deployments/docker/docker-compose.yaml restart lgtm'

  compose-down:
    desc: stop local infra and drop its volume
    cmds:
      - '{{.COMPOSE}} -f deployments/docker/docker-compose.yaml down -v'

  # ── Modules ─────────────────────────────────────────────────────────────────

  rename:
    desc: 'task rename -- github.com/you/repo → rewrite the module path everywhere, then regenerate'
    preconditions:
      - sh: test -n "{{.CLI_ARGS}}"
        msg: 'usage: task rename -- <new module prefix, e.g. github.com/you/repo>'
    cmds:
      - scripts/rename.sh {{.CLI_ARGS}}
      - task: gen
      - task: wire
      - task: tidy

  sync:
    desc: push workspace build list into every go.mod (run after adding deps)
    cmds: [go work sync]

  tidy:
    desc: go mod tidy in every module, then go work sync
    cmds:
      - for: { var: MODULES }
        cmd: cd {{.ITEM}} && go mod tidy
      - go work sync

  clean:
    cmds:
      - rm -rf {{.BIN_DIR}}
