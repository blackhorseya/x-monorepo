# The rpc of the "oidc-dex" project (started per test by rpc.ts): auth required, and the dev Dex
# (deployments/docker/dex/config.yaml) as the only OIDC issuer. The issuer is plain http on a
# non-loopback host, so allow_insecure_issuer is needed (dev only; the same setting as
# deployments/helm/kind/values.yaml).
auth:
  mode: required
  # The static admin key that sets accounts up is per attempt: rpc.ts passes APP_AUTH_API_KEYS.
  oidc:
    enabled: true
    issuers:
      - issuer: http://dex.localtest.me:5556/dex
        audience: x-console
        mapping: bound
        allow_insecure_issuer: true
