# The rpc of the "oidc-dex" project: auth required, one static admin key (to set accounts up), and
# the dev Dex (deployments/docker/dex/config.yaml) as the only OIDC issuer. Port 18131 is
# rpcPort + 40 in playwright.config.ts. The issuer is plain http on a non-loopback host, so
# allow_insecure_issuer is needed (dev only; the same setting as deployments/helm/kind/values.yaml).
auth:
  mode: required
  api_keys: "root=e2e-dex-admin-key-0123456789abcdef:admin"
  oidc:
    enabled: true
    issuers:
      - issuer: http://dex.localtest.me:5556/dex
        audience: x-console
        mapping: bound
        allow_insecure_issuer: true
