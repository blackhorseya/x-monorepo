# Response headers for what nginx serves itself (index.html, assets). Included per location
# because nginx's add_header does not inherit into a location that has its own add_header.
# Not applied to /api/: the rpc owns those responses (and /api/docs loads Scalar from a CDN).
#
# CSP: the Vite build is self-hosted scripts + one stylesheet; Radix / shadcn set inline
# style attributes (hence 'unsafe-inline' for styles only — scripts stay strict); the only
# network the app does is Connect RPCs to its own origin (/api).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
