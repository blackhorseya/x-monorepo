openapi: 3.1.0
info:
  title: Payment API (public)
  version: v1
  description: |
    The payment API apps/rpc serves to users: `payment.v1.PublicPaymentService` (docs/payment.md §6).
    Every procedure is `POST /api/payment.v1.PublicPaymentService/<Method>` (the bare `/payment.v1.PublicPaymentService/<Method>` works too, for gRPC) with a JSON body;
    errors use the Connect error shape `{ "code": "...", "message": "..." }` and carry
    the stable domain code in the `X-Error-Code` response header.
    Requests carry the order id only: who is paying comes from the credential. The internal
    `payment.v1.PaymentService` (payment-rpc, service key only) is not part of this document.
servers:
  - url: /api
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Static key from `auth.api_keys` (`name=key[:role|role]`); the principal's subject is the customer.
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT verified against `auth.jwt` (or an OIDC login); the subject is the customer.
  schemas:
    common.v1.Money:
      type: object
      properties:
        amountMinor:
          type: string
          title: amount_minor
          minimum: 0
          format: int64
          description: Amount in minor units (e.g. cents). Never negative on the wire.
        currency:
          type: string
          title: currency
          pattern: ^[A-Z]{3}$
          description: ISO 4217 currency code, e.g. "USD".
      title: Money
      additionalProperties: false
      description: Money is the wire representation of the kernel Money value object.
    connect-protocol-version:
      type: number
      examples:
        - 1
      title: Connect-Protocol-Version
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      examples:
        - 1000
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`.'
        value:
          type: string
          format: byte
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          type: object
          title: Debug
          additionalProperties: true
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: A point in time in RFC 3339 format, with up to nanosecond precision. Output uses UTC (`Z`); input may use an offset from UTC.
    payment.v1.Payment:
      type: object
      properties:
        id:
          type: string
          title: id
        orderId:
          type: string
          title: order_id
        customerId:
          type: string
          title: customer_id
        amount:
          allOf:
            - $ref: '#/components/schemas/common.v1.Money'
          title: amount
        status:
          allOf:
            - $ref: '#/components/schemas/payment.v1.PaymentStatus'
          title: status
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expires_at
          description: The payment window closes here; StartPayment refuses a PENDING payment at or after it.
        checkoutUrl:
          type: string
          title: checkout_url
          description: The provider's hosted checkout page; empty until StartPayment has run.
        checkoutExpiresAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: checkout_expires_at
          description: The checkout page stops working here; empty until StartPayment has run.
        updateTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: update_time
      title: Payment
      additionalProperties: false
      description: Payment is the single payment of one order.
    payment.v1.PaymentStatus:
      type: string
      title: PaymentStatus
      enum:
        - PAYMENT_STATUS_UNSPECIFIED
        - PAYMENT_STATUS_PENDING
        - PAYMENT_STATUS_CAPTURED
        - PAYMENT_STATUS_EXPIRED
        - PAYMENT_STATUS_CANCELLED
        - PAYMENT_STATUS_REFUNDING
        - PAYMENT_STATUS_REFUNDED
        - PAYMENT_STATUS_NEEDS_REVIEW
      description: PaymentStatus mirrors docs/payment.md §3. Only PENDING accepts StartPayment.
    payment.v1.PublicPaymentServiceGetPaymentRequest:
      type: object
      properties:
        orderId:
          type: string
          title: order_id
          maxLength: 64
          minLength: 1
      title: PublicPaymentServiceGetPaymentRequest
      additionalProperties: false
    payment.v1.PublicPaymentServiceGetPaymentResponse:
      type: object
      properties:
        payment:
          allOf:
            - $ref: '#/components/schemas/payment.v1.Payment'
          title: payment
      title: PublicPaymentServiceGetPaymentResponse
      additionalProperties: false
    payment.v1.PublicPaymentServiceStartPaymentRequest:
      type: object
      properties:
        orderId:
          type: string
          title: order_id
          maxLength: 64
          minLength: 1
      title: PublicPaymentServiceStartPaymentRequest
      additionalProperties: false
    payment.v1.PublicPaymentServiceStartPaymentResponse:
      type: object
      properties:
        payment:
          allOf:
            - $ref: '#/components/schemas/payment.v1.Payment'
          title: payment
      title: PublicPaymentServiceStartPaymentResponse
      additionalProperties: false
security:
  - apiKey: []
  - bearer: []
paths:
  /payment.v1.PublicPaymentService/GetPayment:
    post:
      tags:
        - payment.v1.PublicPaymentService
      summary: GetPayment
      description: |-
        GetPayment reads the payment of an order: its own customer and an admin, anyone else NOT_FOUND
         (payment.not_found). It is not behind ordering.require_payment.
      operationId: payment.v1.PublicPaymentService.GetPayment
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/payment.v1.PublicPaymentServiceGetPaymentRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/payment.v1.PublicPaymentServiceGetPaymentResponse'
  /payment.v1.PublicPaymentService/StartPayment:
    post:
      tags:
        - payment.v1.PublicPaymentService
      summary: StartPayment
      description: |-
        StartPayment opens (or reuses) the provider's hosted checkout for the order's payment and returns the
         payment with its checkout_url. The caller must be able to see the order: someone else's order, or one
         that does not exist, is NOT_FOUND (x-error-code: order.not_found). The answer is payment.disabled
         (FAILED_PRECONDITION) while ordering.require_payment is off or when this order's payment_required
         snapshot is false. Everything else is payment-rpc's answer, unchanged (payment.not_found,
         payment.not_pending, payment.expired, payment.permission_denied, payment.provider_unavailable); when
         payment-rpc cannot be reached it is UNAVAILABLE with payment.unavailable and a fixed message.
      operationId: payment.v1.PublicPaymentService.StartPayment
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/payment.v1.PublicPaymentServiceStartPaymentRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/payment.v1.PublicPaymentServiceStartPaymentResponse'
tags:
  - name: payment.v1.PublicPaymentService
    description: |-
      PublicPaymentService is the payment API that apps/rpc serves to users, next to ordering.v1.OrderService.
       It is NOT the service payment-rpc serves (PaymentService): that one takes customer_id and admin as
       request fields, which are the caller's claims, and the only caller that may make them is apps/rpc after
       it verified the user. This one has no such fields, so a client has nowhere to write who it is: apps/rpc
       takes the customer from the verified credential (and admin from the configured admin role) and fills the
       internal request itself, with the service key. docs/payment.md §6.

       A call without a credential is UNAUTHENTICATED. The method names are those of the internal service on
       purpose; the messages are not.
