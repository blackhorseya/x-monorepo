openapi: 3.1.0
info:
  title: Ordering API
  version: v1
  description: |
    Connect RPC contract of the ordering bounded context.
    Every procedure is `POST /api/ordering.v1.OrderService/<Method>` (the bare `/ordering.v1.OrderService/<Method>` works too, for gRPC) with a JSON body;
    errors use the Connect error shape `{ "code": "...", "message": "..." }` and carry
    the stable domain code in the `X-Error-Code` response header.
servers:
  - url: /api
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Static key from `auth.api_keys` (`name=key[:role|role]`); the principal's subject is the name.
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT verified against `auth.jwt` (HS256 secret or PEM public key); claims sub / name / roles.
  schemas:
    common.v1.Money:
      type: object
      properties:
        amountMinor:
          type: string
          title: amount_minor
          minimum: 0
          format: int64
          description: Amount in minor units (e.g. cents). Never negative on the wire.
        currency:
          type: string
          title: currency
          pattern: ^[A-Z]{3}$
          description: ISO 4217 currency code, e.g. "USD".
      title: Money
      additionalProperties: false
      description: Money is the wire representation of the kernel Money value object.
    connect-protocol-version:
      type: number
      examples:
        - 1
      title: Connect-Protocol-Version
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      examples:
        - 1000
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`.'
        value:
          type: string
          format: byte
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          type: object
          title: Debug
          additionalProperties: true
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: A point in time in RFC 3339 format, with up to nanosecond precision. Output uses UTC (`Z`); input may use an offset from UTC.
    ordering.v1.CancelOrderRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          minLength: 1
      title: CancelOrderRequest
      additionalProperties: false
    ordering.v1.CancelOrderResponse:
      type: object
      properties:
        order:
          allOf:
            - $ref: '#/components/schemas/ordering.v1.Order'
          title: order
      title: CancelOrderResponse
      additionalProperties: false
    ordering.v1.CancellationCause:
      type: string
      title: CancellationCause
      enum:
        - CANCELLATION_CAUSE_UNSPECIFIED
        - CANCELLATION_CAUSE_STOCK_SHORTAGE
        - CANCELLATION_CAUSE_RESERVATION_EXPIRED
      description: CancellationCause classifies an OrderCancellationRequested.
    ordering.v1.CompleteOrderRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          minLength: 1
      title: CompleteOrderRequest
      additionalProperties: false
    ordering.v1.CompleteOrderResponse:
      type: object
      properties:
        order:
          allOf:
            - $ref: '#/components/schemas/ordering.v1.Order'
          title: order
      title: CompleteOrderResponse
      additionalProperties: false
    ordering.v1.CreateOrderItem:
      type: object
      properties:
        sku:
          type: string
          title: sku
          minLength: 1
        quantity:
          exclusiveMinimum: 0
          type: integer
          title: quantity
          format: int32
      title: CreateOrderItem
      additionalProperties: false
      description: |-
        CreateOrderItem is one line of a CreateOrder request. It used to be
         ordering.v1.LineItem with a caller-supplied unit_price (field 3); the price now
         comes from the catalog, so the field is gone. The numbers of sku and quantity
         are unchanged, so an old client keeps working on the wire: a field 3 it still
         sends is an unknown field, ignored by the binary codecs, and discarded by
         connect-go's JSON codec (see apps/rpc/order_pricing_test.go).
    ordering.v1.CreateOrderRequest:
      type: object
      properties:
        customerId:
          type: string
          title: customer_id
          description: |-
            Optional. Empty = the caller (their principal's subject). A non-admin may
             only name themselves; an admin may name any customer; an anonymous caller
             (auth off) must name one, else INVALID_ARGUMENT (order.empty_customer).
        items:
          type: array
          items:
            $ref: '#/components/schemas/ordering.v1.CreateOrderItem'
          title: items
          minItems: 1
          description: |-
            What to buy: sku and quantity only. The unit price is the catalog's
             (catalog.v1.CatalogService), read when the order is placed and stored on
             the order's lines as a snapshot; an unknown or inactive SKU is
             INVALID_ARGUMENT (order.unknown_sku / order.inactive_sku) and one order
             cannot mix currencies (order.mixed_currency).
        idempotencyKey:
          type: string
          title: idempotency_key
          maxLength: 64
          pattern: ^[\x21-\x7E]*$
          description: |-
            Optional retry token (1-64 visible ASCII characters). Empty = no protection:
             every call creates an order. With a key, retrying the same items returns the
             original order as it is now (nothing is created or published again), and the
             same key with different items (item order counts) is ALREADY_EXISTS
             (order.idempotency_key_reused). The key is scoped to the customer the order
             is placed for, so an admin acting for a customer shares that customer's keys.
      title: CreateOrderRequest
      additionalProperties: false
    ordering.v1.CreateOrderResponse:
      type: object
      properties:
        order:
          allOf:
            - $ref: '#/components/schemas/ordering.v1.Order'
          title: order
      title: CreateOrderResponse
      additionalProperties: false
    ordering.v1.GetOrderHistoryRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          minLength: 1
      title: GetOrderHistoryRequest
      additionalProperties: false
    ordering.v1.GetOrderHistoryResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ordering.v1.OrderHistoryEntry'
          title: entries
          description: Ordered by seq, at most 4 entries.
      title: GetOrderHistoryResponse
      additionalProperties: false
    ordering.v1.GetOrderRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          minLength: 1
      title: GetOrderRequest
      additionalProperties: false
    ordering.v1.GetOrderResponse:
      type: object
      properties:
        order:
          allOf:
            - $ref: '#/components/schemas/ordering.v1.Order'
          title: order
      title: GetOrderResponse
      additionalProperties: false
    ordering.v1.LineItem:
      type: object
      properties:
        sku:
          type: string
          title: sku
          minLength: 1
        quantity:
          exclusiveMinimum: 0
          type: integer
          title: quantity
          format: int32
        unitPrice:
          allOf:
            - $ref: '#/components/schemas/common.v1.Money'
          title: unit_price
      title: LineItem
      required:
        - unitPrice
      additionalProperties: false
      description: |-
        LineItem is one line of an Order. unit_price is the snapshot of the catalog
         price at the moment the order was placed: a later reprice does not change it.
    ordering.v1.ListOrdersRequest:
      type: object
      properties:
        customerId:
          type: string
          title: customer_id
          description: |-
            Empty = any customer for an admin or anonymous caller, the caller's own
             orders for anyone else. A non-admin naming another customer is PERMISSION_DENIED.
        status:
          allOf:
            - $ref: '#/components/schemas/ordering.v1.OrderStatus'
          title: status
          description: ORDER_STATUS_UNSPECIFIED = any status.
        pageSize:
          type: integer
          title: page_size
          minimum: 0
          format: int32
          description: 0 = server default (20); values above the maximum (100) are clamped; negative = INVALID_ARGUMENT.
        pageToken:
          type: string
          title: page_token
          description: Opaque; from the previous ListOrdersResponse.next_page_token.
      title: ListOrdersRequest
      additionalProperties: false
    ordering.v1.ListOrdersResponse:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/ordering.v1.Order'
          title: orders
        nextPageToken:
          type: string
          title: next_page_token
          description: Empty when this is the last page.
      title: ListOrdersResponse
      additionalProperties: false
    ordering.v1.Order:
      type: object
      properties:
        id:
          type: string
          title: id
        customerId:
          type: string
          title: customer_id
        items:
          type: array
          items:
            $ref: '#/components/schemas/ordering.v1.LineItem'
          title: items
        total:
          allOf:
            - $ref: '#/components/schemas/common.v1.Money'
          title: total
        status:
          allOf:
            - $ref: '#/components/schemas/ordering.v1.OrderStatus'
          title: status
        createTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: create_time
        updateTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: update_time
        paymentRequired:
          type: boolean
          title: payment_required
          description: |-
            Snapshot of ordering.require_payment taken when the order became CONFIRMED, never changed
             afterwards; false for every order that was CONFIRMED before the setting existed. Ordering decides
             CompleteOrder and the payment events from this value only (docs/payment.md §2, §8).
      title: Order
      additionalProperties: false
    ordering.v1.OrderCancellationRequested:
      type: object
      properties:
        orderId:
          type: string
          title: order_id
        reason:
          type: string
          title: reason
          description: |-
            Free text from the requesting BC: informational only. Ordering neither stores nor logs it
             (it is untrusted and unstable); the typed cause below is what it records.
        requestedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: requested_at
        cause:
          allOf:
            - $ref: '#/components/schemas/ordering.v1.CancellationCause'
          title: cause
          description: |-
            Why the requester asks, as a fixed enumeration. Additive (#427): an event published before this
             field existed carries no cause (CANCELLATION_CAUSE_UNSPECIFIED), and a value this version of
             ordering does not know is treated the same way — the order history records both as an
             unclassified request (CANCELLATION_REQUESTED).
      title: OrderCancellationRequested
      additionalProperties: false
      description: |-
        OrderCancellationRequested is published by another BC (e.g. payment timeout)
         to ask ordering to cancel an order.
    ordering.v1.OrderCancelled:
      type: object
      properties:
        orderId:
          type: string
          title: order_id
        customerId:
          type: string
          title: customer_id
        cancelledAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: cancelled_at
      title: OrderCancelled
      additionalProperties: false
      description: |-
        OrderCancelled is raised when an order moves to CANCELLED, whatever asked
         for it (client call or OrderCancellationRequested).
    ordering.v1.OrderCompleted:
      type: object
      properties:
        orderId:
          type: string
          title: order_id
        customerId:
          type: string
          title: customer_id
        completedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: completed_at
      title: OrderCompleted
      additionalProperties: false
      description: |-
        OrderCompleted is raised when an order moves to COMPLETED (CompleteOrder on a
         CONFIRMED order): inventory consumes it to commit the reservation.
    ordering.v1.OrderConfirmed:
      type: object
      properties:
        orderId:
          type: string
          title: order_id
        customerId:
          type: string
          title: customer_id
        confirmedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: confirmed_at
        total:
          allOf:
            - $ref: '#/components/schemas/common.v1.Money'
          title: total
          description: |-
            The order's actual total. Payment bills from it; an event without it (published before this
             field existed) must be rejected, never read as a 0 charge (docs/payment.md §2).
      title: OrderConfirmed
      additionalProperties: false
      description: |-
        OrderConfirmed is raised when an order moves to CONFIRMED: ordering consumed
         inventory.v1.StockReserved for it (every line reserved).
    ordering.v1.OrderCreated:
      type: object
      properties:
        orderId:
          type: string
          title: order_id
        customerId:
          type: string
          title: customer_id
        items:
          type: array
          items:
            $ref: '#/components/schemas/ordering.v1.OrderCreatedItem'
          title: items
        total:
          allOf:
            - $ref: '#/components/schemas/common.v1.Money'
          title: total
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
      title: OrderCreated
      additionalProperties: false
      description: |-
        OrderCreated is raised once per New order, in the same transaction that
         persists it.
    ordering.v1.OrderCreatedItem:
      type: object
      properties:
        sku:
          type: string
          title: sku
        quantity:
          type: integer
          title: quantity
          format: int32
      title: OrderCreatedItem
      additionalProperties: false
    ordering.v1.OrderHistoryActorKind:
      type: string
      title: OrderHistoryActorKind
      enum:
        - ORDER_HISTORY_ACTOR_KIND_UNSPECIFIED
        - ORDER_HISTORY_ACTOR_KIND_CUSTOMER
        - ORDER_HISTORY_ACTOR_KIND_ADMIN
        - ORDER_HISTORY_ACTOR_KIND_SYSTEM
        - ORDER_HISTORY_ACTOR_KIND_ANONYMOUS
      description: OrderHistoryActorKind is who made an order move (docs/order-history.md).
    ordering.v1.OrderHistoryCause:
      type: string
      title: OrderHistoryCause
      enum:
        - ORDER_HISTORY_CAUSE_UNSPECIFIED
        - ORDER_HISTORY_CAUSE_RPC_REQUEST
        - ORDER_HISTORY_CAUSE_PAYMENT_CAPTURED
        - ORDER_HISTORY_CAUSE_PAYMENT_EXPIRED
        - ORDER_HISTORY_CAUSE_STOCK_RESERVED
        - ORDER_HISTORY_CAUSE_CANCELLATION_REQUESTED
        - ORDER_HISTORY_CAUSE_STOCK_SHORTAGE
        - ORDER_HISTORY_CAUSE_RESERVATION_EXPIRED
      description: |-
        OrderHistoryCause is why an order moved, as a fixed enumeration. Another BC's free text is never one.
         A client must treat a value it does not know as UNSPECIFIED: the set can grow.
    ordering.v1.OrderHistoryEntry:
      type: object
      properties:
        seq:
          type: integer
          title: seq
          format: int32
          description: 1..N per order, in the order the transitions happened.
        fromStatus:
          allOf:
            - $ref: '#/components/schemas/ordering.v1.OrderStatus'
          title: from_status
          description: ORDER_STATUS_UNSPECIFIED for the creation (there is no previous state).
        toStatus:
          allOf:
            - $ref: '#/components/schemas/ordering.v1.OrderStatus'
          title: to_status
        occurredTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: occurred_time
          description: When the domain made the transition (not when the row was written).
        actorKind:
          allOf:
            - $ref: '#/components/schemas/ordering.v1.OrderHistoryActorKind'
          title: actor_kind
        actorSubject:
          type: string
          title: actor_subject
          description: |-
            The account id of a CUSTOMER or ADMIN actor. Only an admin is shown it; for any other caller
             it is empty.
        cause:
          allOf:
            - $ref: '#/components/schemas/ordering.v1.OrderHistoryCause'
          title: cause
      title: OrderHistoryEntry
      additionalProperties: false
      description: OrderHistoryEntry is one transition of an order. Entries are append-only.
    ordering.v1.OrderPaid:
      type: object
      properties:
        orderId:
          type: string
          title: order_id
        customerId:
          type: string
          title: customer_id
        paidAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: paid_at
      title: OrderPaid
      additionalProperties: false
      description: |-
        OrderPaid is raised when an order moves CONFIRMED → PAID. Reserved for Fulfillment; nothing
         publishes it until Payment lands (docs/payment.md §4).
    ordering.v1.OrderStatus:
      type: string
      title: OrderStatus
      enum:
        - ORDER_STATUS_UNSPECIFIED
        - ORDER_STATUS_PENDING
        - ORDER_STATUS_CANCELLED
        - ORDER_STATUS_CONFIRMED
        - ORDER_STATUS_COMPLETED
        - ORDER_STATUS_PAID
security:
  - apiKey: []
  - bearer: []
paths:
  /ordering.v1.OrderService/CancelOrder:
    post:
      tags:
        - ordering.v1.OrderService
      summary: CancelOrder
      operationId: ordering.v1.OrderService.CancelOrder
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ordering.v1.CancelOrderRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ordering.v1.CancelOrderResponse'
  /ordering.v1.OrderService/CompleteOrder:
    post:
      tags:
        - ordering.v1.OrderService
      summary: CompleteOrder
      description: |-
        CompleteOrder fulfils a CONFIRMED order (CONFIRMED → COMPLETED) and publishes
         ordering.v1.OrderCompleted, on which inventory commits the reservation.
         Any other status is FAILED_PRECONDITION (x-error-code: order.cannot_complete).
      operationId: ordering.v1.OrderService.CompleteOrder
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ordering.v1.CompleteOrderRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ordering.v1.CompleteOrderResponse'
  /ordering.v1.OrderService/CreateOrder:
    post:
      tags:
        - ordering.v1.OrderService
      summary: CreateOrder
      description: |-
        CreateOrder places a PENDING order. Whose order it is depends on who calls
         (auth.mode on, principal = the caller's account id or JWT sub):
           - a non-admin always orders for themselves; naming another customer_id is
             PERMISSION_DENIED (x-error-code: order.permission_denied);
           - an admin (auth.admin_role) may order on behalf of a customer, and without
             customer_id orders for themselves;
           - anonymous (auth.mode off, or a public procedure): customer_id is required.
      operationId: ordering.v1.OrderService.CreateOrder
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ordering.v1.CreateOrderRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ordering.v1.CreateOrderResponse'
  /ordering.v1.OrderService/GetOrder:
    post:
      tags:
        - ordering.v1.OrderService
      summary: GetOrder
      description: |-
        GetOrder reads one order. A non-admin reading someone else's order gets
         NOT_FOUND, the same answer as for an order that does not exist.
      operationId: ordering.v1.OrderService.GetOrder
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ordering.v1.GetOrderRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ordering.v1.GetOrderResponse'
  /ordering.v1.OrderService/GetOrderHistory:
    post:
      tags:
        - ordering.v1.OrderService
      summary: GetOrderHistory
      description: |-
        GetOrderHistory returns every state transition of one order, oldest first (seq 1..N). It is not
         paged: the state machine bounds it at 4 entries (PENDING → CONFIRMED → PAID → COMPLETED; a
         cancelled order has fewer), and a test turns red if a longer path ever becomes possible.
         Ownership is GetOrder's: a non-admin reading someone else's order gets NOT_FOUND
         (x-error-code: order.not_found), decided where the order is selected, and so does an order that
         does not exist. An order created before the history existed has none: an empty list, not an error.
         actor_subject is returned to an admin only; for every other caller (a customer, or anonymous when
         auth.mode is off) it is always empty, whatever the stored row says.
      operationId: ordering.v1.OrderService.GetOrderHistory
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ordering.v1.GetOrderHistoryRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ordering.v1.GetOrderHistoryResponse'
  /ordering.v1.OrderService/ListOrders:
    post:
      tags:
        - ordering.v1.OrderService
      summary: ListOrders
      description: |-
        ListOrders pages through orders newest first (create_time desc, id desc).
         Cursor pagination per AIP-158: pass next_page_token back unchanged with the
