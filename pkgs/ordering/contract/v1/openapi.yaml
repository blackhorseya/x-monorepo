openapi: 3.1.0
info:
  title: Ordering API
  version: v1
  description: |
    Connect RPC contract of the ordering bounded context.
    Every procedure is `POST /api/ordering.v1.OrderService/<Method>` (the bare `/ordering.v1.OrderService/<Method>` works too, for gRPC) with a JSON body;
    errors use the Connect error shape `{ "code": "...", "message": "..." }` and carry
    the stable domain code in the `X-Error-Code` response header.
servers:
  - url: /api
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Static key from `auth.api_keys` (`name=key[:role|role]`); the principal's subject is the name.
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT verified against `auth.jwt` (HS256 secret or PEM public key); claims sub / name / roles.
  schemas:
    common.v1.Money:
      type: object
      properties:
        amountMinor:
          type: string
          title: amount_minor
          minimum: 0
          format: int64
          description: Amount in minor units (e.g. cents). Never negative on the wire.
        currency:
          type: string
          title: currency
          pattern: ^[A-Z]{3}$
          description: ISO 4217 currency code, e.g. "USD".
      title: Money
      additionalProperties: false
      description: Money is the wire representation of the kernel Money value object.
    connect-protocol-version:
      type: number
      examples:
        - 1
      title: Connect-Protocol-Version
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      examples:
        - 1000
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`.'
        value:
          type: string
          format: byte
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          type: object
          title: Debug
          additionalProperties: true
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: A point in time in RFC 3339 format, with up to nanosecond precision. Output uses UTC (`Z`); input may use an offset from UTC.
    ordering.v1.CancelOrderRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          minLength: 1
      title: CancelOrderRequest
      additionalProperties: false
    ordering.v1.CancelOrderResponse:
      type: object
      properties:
        order:
          allOf:
            - $ref: '#/components/schemas/ordering.v1.Order'
          title: order
      title: CancelOrderResponse
      additionalProperties: false
    ordering.v1.CompleteOrderRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          minLength: 1
      title: CompleteOrderRequest
      additionalProperties: false
    ordering.v1.CompleteOrderResponse:
      type: object
      properties:
        order:
          allOf:
            - $ref: '#/components/schemas/ordering.v1.Order'
          title: order
      title: CompleteOrderResponse
      additionalProperties: false
    ordering.v1.CreateOrderRequest:
      type: object
      properties:
        customerId:
          type: string
          title: customer_id
          description: |-
            Optional. Empty = the caller (their principal's subject). A non-admin may
             only name themselves; an admin may name any customer; an anonymous caller
             (auth off) must name one, else INVALID_ARGUMENT (order.empty_customer).
        items:
          type: array
          items:
            $ref: '#/components/schemas/ordering.v1.LineItem'
          title: items
          minItems: 1
      title: CreateOrderRequest
      additionalProperties: false
    ordering.v1.CreateOrderResponse:
      type: object
      properties:
        order:
          allOf:
            - $ref: '#/components/schemas/ordering.v1.Order'
          title: order
      title: CreateOrderResponse
      additionalProperties: false
    ordering.v1.GetOrderRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          minLength: 1
      title: GetOrderRequest
      additionalProperties: false
    ordering.v1.GetOrderResponse:
      type: object
      properties:
        order:
          allOf:
            - $ref: '#/components/schemas/ordering.v1.Order'
          title: order
      title: GetOrderResponse
      additionalProperties: false
    ordering.v1.LineItem:
      type: object
      properties:
        sku:
          type: string
          title: sku
          minLength: 1
        quantity:
          exclusiveMinimum: 0
          type: integer
          title: quantity
          format: int32
        unitPrice:
          allOf:
            - $ref: '#/components/schemas/common.v1.Money'
          title: unit_price
      title: LineItem
      required:
        - unitPrice
      additionalProperties: false
    ordering.v1.ListOrdersRequest:
      type: object
      properties:
        customerId:
          type: string
          title: customer_id
          description: |-
            Empty = any customer for an admin or anonymous caller, the caller's own
             orders for anyone else. A non-admin naming another customer is PERMISSION_DENIED.
        status:
          allOf:
            - $ref: '#/components/schemas/ordering.v1.OrderStatus'
          title: status
          description: ORDER_STATUS_UNSPECIFIED = any status.
        pageSize:
          type: integer
          title: page_size
          minimum: 0
          format: int32
          description: 0 = server default (20); values above the maximum (100) are clamped; negative = INVALID_ARGUMENT.
        pageToken:
          type: string
          title: page_token
          description: Opaque; from the previous ListOrdersResponse.next_page_token.
      title: ListOrdersRequest
      additionalProperties: false
    ordering.v1.ListOrdersResponse:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/ordering.v1.Order'
          title: orders
        nextPageToken:
          type: string
          title: next_page_token
          description: Empty when this is the last page.
      title: ListOrdersResponse
      additionalProperties: false
    ordering.v1.Order:
      type: object
      properties:
        id:
          type: string
          title: id
        customerId:
          type: string
          title: customer_id
        items:
          type: array
          items:
            $ref: '#/components/schemas/ordering.v1.LineItem'
          title: items
        total:
          allOf:
            - $ref: '#/components/schemas/common.v1.Money'
          title: total
        status:
          allOf:
            - $ref: '#/components/schemas/ordering.v1.OrderStatus'
          title: status
        createTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: create_time
        updateTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: update_time
      title: Order
      additionalProperties: false
    ordering.v1.OrderCancellationRequested:
      type: object
      properties:
        orderId:
          type: string
          title: order_id
        reason:
          type: string
          title: reason
        requestedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: requested_at
      title: OrderCancellationRequested
      additionalProperties: false
      description: |-
        OrderCancellationRequested is published by another BC (e.g. payment timeout)
         to ask ordering to cancel an order.
    ordering.v1.OrderCancelled:
      type: object
      properties:
        orderId:
          type: string
          title: order_id
        customerId:
          type: string
          title: customer_id
        cancelledAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: cancelled_at
      title: OrderCancelled
      additionalProperties: false
      description: |-
        OrderCancelled is raised when an order moves to CANCELLED, whatever asked
         for it (client call or OrderCancellationRequested).
    ordering.v1.OrderCompleted:
      type: object
      properties:
        orderId:
          type: string
          title: order_id
        customerId:
          type: string
          title: customer_id
        completedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: completed_at
      title: OrderCompleted
      additionalProperties: false
      description: |-
        OrderCompleted is raised when an order moves to COMPLETED (CompleteOrder on a
         CONFIRMED order): inventory consumes it to commit the reservation.
    ordering.v1.OrderConfirmed:
      type: object
      properties:
        orderId:
          type: string
          title: order_id
        customerId:
          type: string
          title: customer_id
        confirmedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: confirmed_at
      title: OrderConfirmed
      additionalProperties: false
      description: |-
        OrderConfirmed is raised when an order moves to CONFIRMED: ordering consumed
         inventory.v1.StockReserved for it (every line reserved).
    ordering.v1.OrderCreated:
      type: object
      properties:
        orderId:
          type: string
          title: order_id
        customerId:
          type: string
          title: customer_id
        items:
          type: array
          items:
            $ref: '#/components/schemas/ordering.v1.OrderCreatedItem'
          title: items
        total:
          allOf:
            - $ref: '#/components/schemas/common.v1.Money'
          title: total
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
      title: OrderCreated
      additionalProperties: false
      description: |-
        OrderCreated is raised once per New order, in the same transaction that
         persists it.
    ordering.v1.OrderCreatedItem:
      type: object
      properties:
        sku:
          type: string
          title: sku
        quantity:
          type: integer
          title: quantity
          format: int32
      title: OrderCreatedItem
      additionalProperties: false
    ordering.v1.OrderStatus:
      type: string
      title: OrderStatus
      enum:
        - ORDER_STATUS_UNSPECIFIED
        - ORDER_STATUS_PENDING
        - ORDER_STATUS_CANCELLED
        - ORDER_STATUS_CONFIRMED
        - ORDER_STATUS_COMPLETED
security:
  - apiKey: []
  - bearer: []
paths:
  /ordering.v1.OrderService/CancelOrder:
    post:
      tags:
        - ordering.v1.OrderService
      summary: CancelOrder
      operationId: ordering.v1.OrderService.CancelOrder
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ordering.v1.CancelOrderRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ordering.v1.CancelOrderResponse'
  /ordering.v1.OrderService/CompleteOrder:
    post:
      tags:
        - ordering.v1.OrderService
      summary: CompleteOrder
      description: |-
        CompleteOrder fulfils a CONFIRMED order (CONFIRMED → COMPLETED) and publishes
         ordering.v1.OrderCompleted, on which inventory commits the reservation.
         Any other status is FAILED_PRECONDITION (x-error-code: order.cannot_complete).
      operationId: ordering.v1.OrderService.CompleteOrder
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ordering.v1.CompleteOrderRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ordering.v1.CompleteOrderResponse'
  /ordering.v1.OrderService/CreateOrder:
    post:
      tags:
        - ordering.v1.OrderService
      summary: CreateOrder
      description: |-
        CreateOrder places a PENDING order. Whose order it is depends on who calls
         (auth.mode on, principal = the caller's account id or JWT sub):
           - a non-admin always orders for themselves; naming another customer_id is
             PERMISSION_DENIED (x-error-code: order.permission_denied);
           - an admin (auth.admin_role) may order on behalf of a customer, and without
             customer_id orders for themselves;
           - anonymous (auth.mode off, or a public procedure): customer_id is required.
      operationId: ordering.v1.OrderService.CreateOrder
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ordering.v1.CreateOrderRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ordering.v1.CreateOrderResponse'
  /ordering.v1.OrderService/GetOrder:
    post:
      tags:
        - ordering.v1.OrderService
      summary: GetOrder
      description: |-
        GetOrder reads one order. A non-admin reading someone else's order gets
         NOT_FOUND, the same answer as for an order that does not exist.
      operationId: ordering.v1.OrderService.GetOrder
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ordering.v1.GetOrderRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ordering.v1.GetOrderResponse'
  /ordering.v1.OrderService/ListOrders:
    post:
      tags:
        - ordering.v1.OrderService
      summary: ListOrders
      description: |-
        ListOrders pages through orders newest first (create_time desc, id desc).
         Cursor pagination per AIP-158: pass next_page_token back unchanged with the
         SAME filters; a token issued for other filters is rejected as INVALID_ARGUMENT.
         A non-admin lists only their own orders: customer_id empty means themselves,
         another customer is PERMISSION_DENIED. Admin and anonymous callers filter freely.
      operationId: ordering.v1.OrderService.ListOrders
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ordering.v1.ListOrdersRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ordering.v1.ListOrdersResponse'
tags:
  - name: ordering.v1.OrderService
    description: |-
      OrderService is the public RPC contract of the ordering bounded context.
       Request shape (buf.validate rules below) is rejected at the edge with
       INVALID_ARGUMENT before any use case runs; business invariants stay in the domain.
