openapi: 3.1.0
info:
  title: Inventory API
  version: v1
  description: |
    Connect RPC contract of the inventory bounded context.
    Every procedure is `POST /api/inventory.v1.InventoryService/<Method>` (the bare `/inventory.v1.InventoryService/<Method>` works too, for gRPC) with a JSON body;
    errors use the Connect error shape `{ "code": "...", "message": "..." }` and carry
    the stable domain code in the `X-Error-Code` response header.
servers:
  - url: /api
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Static key from `auth.api_keys` (`name=key[:role|role]`); the principal's subject is the name.
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT verified against `auth.jwt` (HS256 secret or PEM public key); claims sub / name / roles.
  schemas:
    connect-protocol-version:
      type: number
      examples:
        - 1
      title: Connect-Protocol-Version
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      examples:
        - 1000
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`.'
        value:
          type: string
          format: byte
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          type: object
          title: Debug
          additionalProperties: true
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    google.protobuf.Duration:
      type: string
      format: duration
      description: A signed duration in seconds, with up to nine fractional digits and an `s` suffix (for example, `3s` or `-0.001s`).
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: A point in time in RFC 3339 format, with up to nanosecond precision. Output uses UTC (`Z`); input may use an offset from UTC.
    inventory.v1.ExpireReservationsRequest:
      type: object
      properties:
        olderThan:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Duration'
          title: older_than
          description: |
            A RESERVED reservation held at least this long expires. Required, positive.
            duration.gt = 0s
        dryRun:
          type: boolean
          title: dry_run
          description: List what would expire, change nothing.
        limit:
          type: integer
          title: limit
          maximum: 1000
          minimum: 0
          format: int32
          description: Reservations per call, oldest first; 0 = server default (100), at most 1000.
      title: ExpireReservationsRequest
      required:
        - olderThan
      additionalProperties: false
    inventory.v1.ExpireReservationsResponse:
      type: object
      properties:
        expired:
          type: array
          items:
            $ref: '#/components/schemas/inventory.v1.ExpiredReservation'
          title: expired
          description: 'Oldest first. len(expired) == limit means there may be more: call again.'
        dryRun:
          type: boolean
          title: dry_run
      title: ExpireReservationsResponse
      additionalProperties: false
    inventory.v1.ExpiredReservation:
      type: object
      properties:
        orderId:
          type: string
          title: order_id
        reservedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: reserved_at
          description: When it was reserved (the start of the hold).
        heldFor:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Duration'
          title: held_for
          description: How long it had been held when the call ran.
      title: ExpiredReservation
      additionalProperties: false
      description: ExpiredReservation is one reservation the call expired — or, dry run, would.
    inventory.v1.GetReservationRequest:
      type: object
      properties:
        orderId:
          type: string
          title: order_id
          minLength: 1
      title: GetReservationRequest
      additionalProperties: false
    inventory.v1.GetReservationResponse:
      type: object
      properties:
        reservation:
          allOf:
            - $ref: '#/components/schemas/inventory.v1.Reservation'
          title: reservation
      title: GetReservationResponse
      additionalProperties: false
    inventory.v1.GetStockRequest:
      type: object
      properties:
        sku:
          type: string
          title: sku
          minLength: 1
      title: GetStockRequest
      additionalProperties: false
    inventory.v1.GetStockResponse:
      type: object
      properties:
        stock:
          allOf:
            - $ref: '#/components/schemas/inventory.v1.Stock'
          title: stock
      title: GetStockResponse
      additionalProperties: false
    inventory.v1.ListReservationsRequest:
      type: object
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/inventory.v1.ReservationStatus'
          title: status
          description: RESERVATION_STATUS_UNSPECIFIED = any status.
        pageSize:
          type: integer
          title: page_size
          minimum: 0
          format: int32
          description: 0 = server default (20); values above the maximum (100) are clamped; negative = INVALID_ARGUMENT.
        pageToken:
          type: string
          title: page_token
          description: Opaque; from the previous ListReservationsResponse.next_page_token.
      title: ListReservationsRequest
      additionalProperties: false
    inventory.v1.ListReservationsResponse:
      type: object
      properties:
        reservations:
          type: array
          items:
            $ref: '#/components/schemas/inventory.v1.Reservation'
          title: reservations
        nextPageToken:
          type: string
          title: next_page_token
          description: Empty when this is the last page.
      title: ListReservationsResponse
      additionalProperties: false
    inventory.v1.ListStocksRequest:
      type: object
      properties:
        pageSize:
          type: integer
          title: page_size
          minimum: 0
          format: int32
          description: 0 = server default (20); values above the maximum (100) are clamped; negative = INVALID_ARGUMENT.
        pageToken:
          type: string
          title: page_token
          description: |-
            Opaque; from the previous ListStocksResponse.next_page_token. It carries
             the filters below: continuing it with different ones is INVALID_ARGUMENT.
        skuPrefix:
          type: string
          title: sku_prefix
          maxLength: 64
          description: Only SKUs starting with this (case-sensitive); empty = every SKU.
        onlyReserved:
          type: boolean
          title: only_reserved
          description: Only SKUs with reserved > 0, i.e. ones pending orders currently hold.
      title: ListStocksRequest
      additionalProperties: false
    inventory.v1.ListStocksResponse:
      type: object
      properties:
        stocks:
          type: array
          items:
            $ref: '#/components/schemas/inventory.v1.Stock'
          title: stocks
        nextPageToken:
          type: string
          title: next_page_token
          description: Empty when this is the last page.
      title: ListStocksResponse
      additionalProperties: false
    inventory.v1.Reservation:
      type: object
      properties:
        orderId:
          type: string
          title: order_id
        lines:
          type: array
          items:
            $ref: '#/components/schemas/inventory.v1.ReservationLine'
          title: lines
        status:
          allOf:
            - $ref: '#/components/schemas/inventory.v1.ReservationStatus'
          title: status
        shortfallSkus:
          type: array
          items:
            type: string
          title: shortfall_skus
          description: SKUs that could not be covered (REJECTED only).
        createTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: create_time
        updateTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: update_time
      title: Reservation
      additionalProperties: false
      description: |-
        Reservation is inventory's record of one order: the outcome of its
         ordering.v1.OrderCreated, or a CANCELLED tombstone when its
         ordering.v1.OrderCancelled arrived first. One per order.
    inventory.v1.ReservationLine:
      type: object
      properties:
        sku:
          type: string
          title: sku
        quantity:
          type: integer
          title: quantity
          format: int32
      title: ReservationLine
      additionalProperties: false
    inventory.v1.ReservationStatus:
      type: string
      title: ReservationStatus
      enum:
        - RESERVATION_STATUS_UNSPECIFIED
        - RESERVATION_STATUS_RESERVED
        - RESERVATION_STATUS_REJECTED
        - RESERVATION_STATUS_RELEASED
        - RESERVATION_STATUS_CANCELLED
        - RESERVATION_STATUS_COMMITTED
        - RESERVATION_STATUS_EXPIRED
    inventory.v1.SetStockRequest:
      type: object
      properties:
        sku:
          type: string
          title: sku
          minLength: 1
        onHand:
          type: integer
          title: on_hand
          minimum: 0
          format: int32
      title: SetStockRequest
      additionalProperties: false
    inventory.v1.SetStockResponse:
      type: object
      properties:
        stock:
          allOf:
            - $ref: '#/components/schemas/inventory.v1.Stock'
          title: stock
      title: SetStockResponse
      additionalProperties: false
    inventory.v1.Stock:
      type: object
      properties:
        sku:
          type: string
          title: sku
        onHand:
          type: integer
          title: on_hand
          format: int32
        reserved:
          type: integer
          title: reserved
          format: int32
        available:
          type: integer
          title: available
          format: int32
        updateTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: update_time
      title: Stock
      additionalProperties: false
      description: |-
        Stock is the quantity of one SKU: on_hand is what the warehouse holds,
         reserved is what pending orders have claimed, available = on_hand - reserved.
    inventory.v1.StockCommitted:
      type: object
      properties:
        orderId:
          type: string
          title: order_id
        committedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: committed_at
      title: StockCommitted
      additionalProperties: false
      description: |-
        StockCommitted is raised when a reservation is committed (order completed):
         the reserved quantity is deducted from on_hand.
    inventory.v1.StockReleased:
      type: object
      properties:
        orderId:
          type: string
          title: order_id
        releasedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: released_at
      title: StockReleased
      additionalProperties: false
      description: StockReleased is raised when a reservation is given back (order cancelled).
    inventory.v1.StockReserved:
      type: object
      properties:
        orderId:
          type: string
          title: order_id
        lines:
          type: array
          items:
            $ref: '#/components/schemas/inventory.v1.StockReservedLine'
          title: lines
        reservedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: reserved_at
      title: StockReserved
      additionalProperties: false
      description: StockReserved is raised when every line of an order was reserved.
    inventory.v1.StockReservedLine:
      type: object
      properties:
        sku:
          type: string
          title: sku
        quantity:
          type: integer
          title: quantity
          format: int32
      title: StockReservedLine
      additionalProperties: false
security:
  - apiKey: []
  - bearer: []
paths:
  /inventory.v1.InventoryService/ExpireReservations:
    post:
      tags:
        - inventory.v1.InventoryService
      summary: ExpireReservations
      description: |-
        ExpireReservations is `worker expire` over RPC: RESERVED reservations held
         longer than older_than give their stock back (EXPIRED, inventory.v1.StockReleased)
         and ordering is asked to cancel the order (ordering.v1.OrderCancellationRequested).
         Oldest first, one transaction per call, at most limit of them; the routine
         sweep is the CronJob, this is the operator's dry run / small run. Requires
         the admin role when auth is on (x-error-code: auth.permission_denied).
      operationId: inventory.v1.InventoryService.ExpireReservations
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/inventory.v1.ExpireReservationsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inventory.v1.ExpireReservationsResponse'
  /inventory.v1.InventoryService/GetReservation:
    post:
      tags:
        - inventory.v1.InventoryService
      summary: GetReservation
      description: GetReservation reads the outcome inventory recorded for an order.
      operationId: inventory.v1.InventoryService.GetReservation
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/inventory.v1.GetReservationRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inventory.v1.GetReservationResponse'
  /inventory.v1.InventoryService/GetStock:
    post:
      tags:
        - inventory.v1.InventoryService
      summary: GetStock
      operationId: inventory.v1.InventoryService.GetStock
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/inventory.v1.GetStockRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inventory.v1.GetStockResponse'
  /inventory.v1.InventoryService/ListReservations:
    post:
      tags:
        - inventory.v1.InventoryService
      summary: ListReservations
      description: ListReservations pages through reservations newest first, optionally by status.
      operationId: inventory.v1.InventoryService.ListReservations
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/inventory.v1.ListReservationsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inventory.v1.ListReservationsResponse'
  /inventory.v1.InventoryService/ListStocks:
    post:
      tags:
        - inventory.v1.InventoryService
      summary: ListStocks
      description: |-
        ListStocks pages through SKUs ascending, optionally narrowed by prefix
         and to SKUs with something reserved.
      operationId: inventory.v1.InventoryService.ListStocks
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/inventory.v1.ListStocksRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inventory.v1.ListStocksResponse'
  /inventory.v1.InventoryService/SetStock:
    post:
      tags:
        - inventory.v1.InventoryService
      summary: SetStock
      description: |-
        SetStock sets the on-hand quantity of a SKU (creates it when unknown).
         Reserved quantity is untouched; on_hand below reserved is INVALID_ARGUMENT.
      operationId: inventory.v1.InventoryService.SetStock
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/inventory.v1.SetStockRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inventory.v1.SetStockResponse'
tags:
  - name: inventory.v1.InventoryService
    description: |-
      InventoryService is the public RPC contract of the inventory bounded context.
       Reservations are not made through RPC: they react to ordering.v1.OrderCreated
       (see pkgs/inventory/adapters/consumer); RPC only seeds and reads.
